<title>המסע של אורן</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
/* Layout: one-screen blocky adventure. HUD on top, scrollable screen area, grass strip at the bottom.
   Single deliberate look (sky world per land); every color set explicitly. Reading text uses a serif with clear nikud. */
:root{
  --ink:#23303b; --ink-soft:#4a5a66; --paper:#fffaf0;
  --birch:#f4e4c1; --grass:#6aa84f; --grass-l:#8acb68; --dirt:#8b5e3c;
  --wood:#c8925a; --wood-d:#94613a; --stone:#9aa1a8;
  --gold:#ffcf4d; --ok:#4fbf63; --ok-d:#2f8f43; --bad:#e2735f; --blue:#3a8fc4;
  --sky1:#8ccbea; --sky2:#eaf5f0;
  --font:'Rubik','Segoe UI',Arial,sans-serif;
  --read:'Frank Ruhl Libre','David','Times New Roman',serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky2);color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #1f6feb;outline-offset:3px}
button:disabled{cursor:default}
svg.px{shape-rendering:crispEdges;display:block}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2) 85%);transition:background 1s}
#app[data-sky="forest"]{--sky1:#7cc3a0;--sky2:#e3f3dc}
#app[data-sky="cave"]{--sky1:#3b3650;--sky2:#7c7593}
#app[data-sky="mount"]{--sky1:#a9d3f5;--sky2:#f1f7fb}
#app[data-sky="sea"]{--sky1:#2f8fb0;--sky2:#bfe9ef}
#app[data-sky="city"]{--sky1:#e9a06b;--sky2:#fbe8d3}
#app[data-sky="final"]{--sky1:#5b3f8c;--sky2:#f2a98b}
.clouds{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;display:block;background:#fff;opacity:.8;width:120px;height:24px;box-shadow:24px -24px 0 #fff,48px -24px 0 #fff,72px 0 0 #fff,96px 0 0 #fff;animation:drift 90s linear infinite}
.c1{top:12%;left:-200px}.c2{top:26%;left:-200px;animation-delay:-35s;transform:scale(.7)}.c3{top:8%;left:-200px;animation-delay:-62s;transform:scale(.5)}
@keyframes drift{to{left:110%}}
#app[data-sky="cave"] .cloud,#app[data-sky="final"] .cloud{opacity:.15}
.ground{flex:0 0 32px;position:relative;z-index:1;background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(0,0,0,.12) 34px 36px),linear-gradient(180deg,var(--grass-l) 0 6px,var(--grass) 6px 14px,var(--dirt) 14px 100%)}
#app[data-sky="cave"] .ground{background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(0,0,0,.2) 34px 36px),linear-gradient(#6b737a 0 8px,#4d5359 8px)}
#app[data-sky="sea"] .ground{background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(0,0,0,.08) 34px 36px),linear-gradient(#f1dca0 0 8px,#d9bf7c 8px)}
#app[data-sky="city"] .ground{background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(0,0,0,.12) 34px 36px),linear-gradient(#b9b2a6 0 8px,#8f877b 8px)}

.hud{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;padding-left:var(--gut);padding-right:var(--gut-r);min-height:56px}
.hud-side{display:flex;gap:8px;min-width:112px}
.hud-side.end{justify-content:flex-end}
.hud-mid{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;min-width:0}
.ibtn{width:50px;height:50px;display:grid;place-items:center;background:var(--birch);box-shadow:inset -4px -4px 0 rgba(0,0,0,.18),inset 4px 4px 0 rgba(255,255,255,.6),0 4px 0 rgba(0,0,0,.25);transition:transform .12s}
.ibtn svg{width:28px;height:28px}
.ibtn.off{opacity:.5}
.chip{font-weight:800;font-size:20px;background:rgba(255,255,255,.88);padding:6px 14px;box-shadow:0 4px 0 rgba(0,0,0,.18);white-space:nowrap}
.progress{display:flex;gap:4px;direction:ltr;flex-wrap:wrap;max-width:380px}
.pb{width:20px;height:20px;background:rgba(255,255,255,.45);box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}
.pb.on{background:var(--grass);box-shadow:inset 0 5px 0 var(--grass-l),inset -3px -3px 0 rgba(0,0,0,.2)}
.pb.cur{background:#fff;box-shadow:inset 0 0 0 3px var(--gold)}
.streak{display:flex;align-items:center;gap:4px;font-weight:900;font-size:22px;background:rgba(255,255,255,.88);padding:2px 10px;box-shadow:0 4px 0 rgba(0,0,0,.18);direction:ltr}
.streak svg{width:22px}
.starcount{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;direction:ltr;background:rgba(255,255,255,.88);padding:4px 12px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.starcount svg{width:26px}

.screens{flex:1;position:relative;z-index:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen{flex:1 0 auto;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:8px;padding-left:var(--gut);padding-right:var(--gut-r);animation:fadein .4s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{40%{transform:scale(1.18)}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.shake{animation:shake .45s}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

.bigbtn{display:inline-flex;align-items:center;gap:12px;font-weight:900;font-size:28px;color:#fff;padding:13px 32px;background:var(--ok);box-shadow:inset -6px -6px 0 var(--ok-d),inset 6px 6px 0 rgba(255,255,255,.35),0 7px 0 rgba(0,0,0,.3);transition:transform .12s}
.bigbtn svg{width:32px;height:32px}
.bigbtn.blue{background:var(--blue);box-shadow:inset -6px -6px 0 #23698f,inset 6px 6px 0 rgba(255,255,255,.3),0 7px 0 rgba(0,0,0,.3)}
.bigbtn.gold{background:var(--gold);color:var(--ink);box-shadow:inset -6px -6px 0 #c99a1c,inset 6px 6px 0 rgba(255,255,255,.4),0 7px 0 rgba(0,0,0,.3)}
.bigbtn.plain{background:var(--birch);color:var(--ink);box-shadow:inset -6px -6px 0 rgba(0,0,0,.15),inset 6px 6px 0 rgba(255,255,255,.6),0 7px 0 rgba(0,0,0,.25)}
.bigbtn.sm{font-size:20px;padding:9px 20px}.bigbtn.sm svg{width:24px;height:24px}
.btnrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
@media (hover:hover){.ibtn:hover,.bigbtn:hover,.key:hover,.land:hover,.node:not(:disabled):hover,.tcell:hover,.hintbtn:hover{filter:brightness(1.07) saturate(1.1);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 6px 0 rgba(0,0,0,.25)}}
.ibtn:active,.bigbtn:active,.key:active{transform:translateY(3px)}

.title{font-weight:900;font-size:clamp(44px,7vw,92px);margin:0;color:#fff;text-align:center;line-height:1.1;text-shadow:5px 5px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.scene{display:flex;align-items:flex-end;gap:22px;justify-content:center;flex-wrap:wrap}
.scene .s-oren svg{width:84px}.scene .s-cat svg{width:84px}.scene .s-giant svg{width:120px}.scene .s-castle svg{width:280px}
.note{font-size:16px;color:var(--ink-soft);background:rgba(255,255,255,.75);padding:6px 12px}

/* MAP */
.mapgrid{display:flex;gap:26px;align-items:center;justify-content:center;flex-wrap:wrap}
.lands{display:grid;grid-template-columns:repeat(3,minmax(150px,190px));gap:16px}
.land{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 10px 12px;min-height:168px;background:var(--birch);box-shadow:inset -6px -6px 0 rgba(0,0,0,.14),inset 6px 6px 0 rgba(255,255,255,.55),0 6px 0 rgba(0,0,0,.25);transition:transform .15s}
.land::before{content:"";position:absolute;inset:0 0 auto;height:14px;background:var(--lc);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.land .ico{height:62px;display:grid;place-items:center}.land .ico svg{height:56px;width:auto}
.land .nm{font-weight:800;font-size:19px;text-align:center}
.land .op{position:absolute;top:20px;inset-inline-start:8px;font-weight:900;font-size:20px;min-width:34px;height:34px;padding:0 4px;display:grid;place-items:center;background:var(--lc);color:#fff}
.land .bar{width:100%;height:12px;background:rgba(0,0,0,.1)}
.land .bar i{display:block;height:100%;background:var(--gold)}
.land .cnt{font-size:15px;font-weight:700;color:var(--ink-soft);direction:ltr;display:flex;gap:4px;align-items:center}
.land .cnt svg{width:16px}
.land.locked{filter:grayscale(.8);opacity:.75}
.land .lk{position:absolute;top:18px;inset-inline-end:8px;width:28px}
.castlepanel{display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(255,255,255,.55);padding:14px 18px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.castlepanel h2{margin:0;font-size:22px;font-weight:900}
.castlepanel .cs svg{width:300px;max-width:100%}
.statline{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:16px;color:var(--ink-soft)}
.statline span{display:flex;align-items:center;gap:5px;direction:rtl}
.statline svg{width:18px}
.savenote{font-size:13px;color:var(--ink-soft)}
.reset{font-size:13px;color:var(--ink-soft);opacity:.6;padding:6px 8px;background:rgba(255,255,255,.4)}
.reset.hold{opacity:1;background:var(--bad);color:#fff}

/* LAND */
.landhead{display:flex;align-items:center;gap:14px}
.landhead .ico svg{height:54px;width:auto}
.landhead h1{margin:0;font-size:38px;font-weight:900;color:#fff;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.path{display:flex;flex-wrap:wrap;gap:22px 16px;justify-content:center;max-width:1060px;direction:ltr}
.node{position:relative;width:118px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 4px 9px;background:var(--paper);box-shadow:inset -5px -5px 0 rgba(0,0,0,.14),inset 5px 5px 0 #fff,0 6px 0 rgba(0,0,0,.28);transition:transform .15s}
.node .lbl{font-weight:900;font-size:24px;direction:ltr;white-space:nowrap;line-height:1.1}
.node .lbl.tx{font-size:18px;direction:rtl}
.node .no{position:absolute;top:-12px;left:-10px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:900;font-size:15px;background:var(--ink);color:#fff}
.node .st{display:flex;gap:2px}.node .st svg{width:22px}
.node.boss{width:150px;background:#efe7ff}
.node.boss .gi svg{width:56px}
.node:disabled{filter:grayscale(1);opacity:.5}
.node:disabled .lk{position:absolute;inset:0;display:grid;place-items:center}
.node:disabled .lk svg{width:32px}
.node.next{box-shadow:0 0 0 5px var(--gold),0 0 22px var(--gold),0 6px 0 rgba(0,0,0,.28);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px var(--gold),0 0 6px var(--gold),0 6px 0 rgba(0,0,0,.28)}}
.unitname{font-weight:800;font-size:20px;background:rgba(255,255,255,.85);padding:6px 14px}

/* PLAY */
.play{width:min(1140px,100%);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.left{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.talk{display:flex;align-items:center;gap:12px;min-height:60px}
.cat svg{width:58px}
.cat.hop{animation:hop .6s}.cat.tilt{animation:tilt .6s}
@keyframes hop{30%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
@keyframes tilt{30%{transform:rotate(-10deg)}70%{transform:rotate(8deg)}}
.bubble{position:relative;display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;background:#fff;padding:9px 16px;box-shadow:0 5px 0 rgba(0,0,0,.18);min-height:48px}
.bubble::before{content:"";position:absolute;inset-inline-start:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-inline-end:14px solid #fff;border-inline-start:0}
.bubble svg{width:24px;height:24px;flex:none;color:var(--blue)}
.bossrow{display:flex;align-items:center;gap:18px}
.giant svg{width:100px}
.giant.hit{animation:hit .5s}.giant.laugh{animation:laugh .6s}.giant.down{animation:down 1s forwards}
@keyframes hit{20%{transform:translateX(10px) rotate(6deg);filter:brightness(1.8)}50%{transform:translateX(-6px)}}
@keyframes laugh{25%{transform:translateY(-10px) scaleY(1.05)}50%{transform:translateY(0)}75%{transform:translateY(-6px)}}
@keyframes down{to{transform:translateY(40px) rotate(-20deg);opacity:0}}
.hp{display:flex;gap:3px;direction:ltr;flex-wrap:wrap;max-width:260px}
.hp i{width:16px;height:20px;background:#e4572e;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.3)}
.hp i.gone{background:rgba(0,0,0,.15);box-shadow:none}
.qarea{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.eqcard{display:flex;align-items:center;gap:14px;direction:ltr;font-weight:900;font-size:64px;font-variant-numeric:tabular-nums;background:var(--paper);padding:12px 26px;box-shadow:inset -6px -6px 0 rgba(0,0,0,.1),inset 6px 6px 0 #fff,0 8px 0 rgba(0,0,0,.28);flex-wrap:wrap;justify-content:center;max-width:100%}
.eqcard .op{color:var(--blue)}
.eqcard .wd{font-size:.42em;font-weight:800;color:var(--ink-soft);direction:rtl;font-family:var(--read)}
.ans{min-width:1.5em;padding:0 10px;text-align:center;background:#fff3c4;box-shadow:inset 0 -6px 0 var(--gold);color:var(--ink);cursor:pointer}
.ans.empty{color:rgba(0,0,0,.25)}
.ans.foc{outline:4px solid var(--blue);outline-offset:2px}
.ans.ok{background:var(--ok);color:#fff;box-shadow:none}
.ans.bad{background:var(--bad);color:#fff;box-shadow:none}
.ans.show{background:var(--blue);color:#fff;box-shadow:none}
.praise{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:28px;font-weight:900;color:var(--ok-d);background:#fff;padding:2px 16px;white-space:nowrap;direction:rtl;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:praise 1s forwards;pointer-events:none;z-index:2}
@keyframes praise{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}25%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.pre{display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,.65);padding:10px 14px}
.pre .cap2{font-weight:900;font-size:24px;direction:ltr}
/* word problems */
.wcard{max-width:760px;background:var(--paper);padding:18px 26px;box-shadow:inset -6px -6px 0 rgba(0,0,0,.08),inset 6px 6px 0 #fff,0 8px 0 rgba(0,0,0,.25);font-family:var(--read);font-size:31px;line-height:1.75;font-weight:500;user-select:text;-webkit-user-select:text}
.wcard b{font-family:var(--font);font-weight:900;color:var(--blue);direction:ltr;unicode-bidi:isolate;padding:0 2px}
.wans{display:flex;align-items:center;gap:12px;font-weight:800;font-size:28px;font-family:var(--read)}
.wans .ans{font-family:var(--font);font-size:44px;font-weight:900;min-width:2.2em}
/* column arithmetic */
.colwrap{display:grid;direction:ltr;gap:4px;background:var(--paper);padding:14px 22px 16px;box-shadow:inset -6px -6px 0 rgba(0,0,0,.08),inset 6px 6px 0 #fff,0 8px 0 rgba(0,0,0,.25);--cw:62px;
  background-image:linear-gradient(rgba(58,143,196,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(58,143,196,.12) 1px,transparent 1px);background-size:var(--cw) var(--cw)}
.cc{width:var(--cw);height:var(--cw);display:grid;place-items:center;font-weight:900;font-size:46px;font-variant-numeric:tabular-nums;position:relative}
.cc.mk{height:34px;font-size:22px;color:#d0452f;align-self:end}
.cc.cr{color:var(--ok-d)}
.cc.x::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:4px;background:#d0452f;transform:rotate(-30deg)}
.cc.x{color:#9aa}
.cc.op{color:var(--blue)}
.cline{grid-column:1/-1;height:5px;background:var(--ink)}
.cb{width:calc(var(--cw) - 6px);height:calc(var(--cw) - 6px);margin:3px;display:grid;place-items:center;font-weight:900;font-size:44px;background:#fff3c4;box-shadow:inset 0 -5px 0 var(--gold)}
.cb.cur{outline:4px solid var(--blue);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{outline-color:transparent}}
.cb.ok{background:#d9f2dd;box-shadow:inset 0 -5px 0 var(--ok)}
.cb.show{background:#d5e8f5;box-shadow:inset 0 -5px 0 var(--blue)}
.cb.bad{background:var(--bad);color:#fff}
.cempty{width:var(--cw)}
.colhint{font-weight:800;font-size:22px;text-align:center}
.hintrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hintbox{width:100%;max-width:740px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;background:rgba(255,255,255,.75);box-shadow:0 5px 0 rgba(0,0,0,.12);animation:fadein .35s}
.cap{font-weight:800;font-size:22px;text-align:center;line-height:1.5}
.hintbtn{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:19px;padding:8px 14px;background:#fff3c4;box-shadow:inset -4px -4px 0 rgba(0,0,0,.12),0 4px 0 rgba(0,0,0,.2)}
.hintbtn svg{width:22px;height:22px}
.hintbtn.lsn{background:#e5f1fb}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:10px;direction:ltr}
.key{height:70px;display:grid;place-items:center;font-weight:900;font-size:34px;background:var(--birch);box-shadow:inset -5px -5px 0 rgba(0,0,0,.16),inset 5px 5px 0 rgba(255,255,255,.6),0 6px 0 rgba(0,0,0,.28);transition:transform .1s}
.key.go{background:var(--ok);color:#fff;box-shadow:inset -5px -5px 0 var(--ok-d),inset 5px 5px 0 rgba(255,255,255,.3),0 6px 0 rgba(0,0,0,.28)}
.key svg{width:30px;height:30px}
.key.press{transform:translateY(3px);filter:brightness(.92)}
/* hint visuals */
.tf{display:flex;gap:14px;direction:ltr;flex-wrap:wrap;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,28px);gap:4px;padding:6px;background:#fff;box-shadow:inset 0 0 0 3px #c9b98f}
.frame i{width:28px;height:28px;position:relative;background:#f1ece0}
.frame i.a{background:#e8873a;box-shadow:inset -3px -3px 0 rgba(0,0,0,.2)}
.frame i.b{background:#3a8fc4;box-shadow:inset -3px -3px 0 rgba(0,0,0,.2)}
.frame i.c{background:#7cc35f;box-shadow:inset -3px -3px 0 rgba(0,0,0,.2)}
.frame i.x{background:#e8873a;opacity:.35}
.frame i.x::after{content:"";position:absolute;left:-2px;right:-2px;top:12px;height:4px;background:#b23a2a;transform:rotate(-45deg)}
.frame i.e{background:#fff;box-shadow:inset 0 0 0 3px #3a8fc4}
.bt{display:flex;gap:24px;direction:ltr;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.btn10{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap;max-width:420px}
.flat{display:grid;grid-template-columns:repeat(10,5px);gap:1px;padding:1px;background:rgba(0,0,0,.18)}
.flat i{width:5px;height:5px;background:var(--c)}
.rod{display:flex;flex-direction:column;gap:1px;padding:1px;background:rgba(0,0,0,.15)}
.rod i{display:block;width:12px;height:5px;background:var(--c)}
.one{display:block;width:12px;height:12px;background:var(--c);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.ones{display:grid;grid-template-columns:repeat(2,12px);gap:2px;align-content:end}
.btlbl{font-weight:900;font-size:22px;text-align:center;margin-top:4px}
.btwrap{display:flex;flex-direction:column;align-items:center}
.steps{display:flex;flex-direction:column;gap:4px;direction:ltr;font-weight:900;font-size:28px;font-variant-numeric:tabular-nums;align-items:center}
.steps div{background:#fff;padding:2px 14px;box-shadow:0 3px 0 rgba(0,0,0,.12);animation:fadein .4s backwards}

.skip{display:flex;gap:4px;direction:ltr;flex-wrap:wrap;justify-content:center;max-width:680px}
.skip b{min-width:44px;height:40px;padding:0 4px;display:grid;place-items:center;font-size:21px;font-weight:900;background:#fff;box-shadow:inset 0 -4px 0 var(--gold);position:relative}
.skip b.q{background:var(--gold);box-shadow:none}
.skip b small{position:absolute;top:-12px;right:-4px;font-size:12px;background:var(--blue);color:#fff;padding:0 4px;line-height:16px}
.arr{display:flex;flex-direction:column;gap:3px;direction:ltr}
.arr .r{display:flex;gap:3px;align-items:center}
.arr .r i{width:var(--s,18px);height:var(--s,18px);background:var(--c);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.arr .r small{width:22px;font-size:13px;font-weight:800;color:var(--ink-soft);text-align:center}
.share{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;direction:ltr}
.box{min-width:64px;min-height:54px;padding:8px 6px 6px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-end;background:#c8925a;box-shadow:inset 0 -5px 0 var(--wood-d),inset 0 5px 0 rgba(255,255,255,.2);max-width:104px}
.box svg{width:16px}
.pile{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:440px;min-height:30px}
.pile svg{width:22px}

/* LESSON / LEARN */
.learn{width:min(1100px,100%);display:flex;flex-direction:column;align-items:center;gap:14px}
.learn h1{margin:0;font-size:36px;font-weight:900;color:#fff;text-align:center;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.lsent{font-family:var(--read);font-size:30px;line-height:1.7;background:rgba(255,255,255,.9);padding:10px 22px;max-width:820px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.lsent b{font-family:var(--font);font-weight:900;color:var(--blue);direction:ltr;unicode-bidi:isolate}
.lgrid{display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap}
.lpanel{background:rgba(255,255,255,.75);padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.14);display:grid;place-items:center}
.facts{display:grid;grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:4px 22px;direction:ltr;font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
.facts div{opacity:.25;transition:opacity .3s}.facts div.on{opacity:1}.facts div.cur{color:var(--ok-d)}
.dealrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;direction:ltr}
.dealbox{width:100px;min-height:80px;padding:10px 6px 6px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-end;background:#c8925a;box-shadow:inset 0 -6px 0 var(--wood-d),inset 0 6px 0 rgba(255,255,255,.2)}
.dealbox svg{width:22px;animation:drop .35s}
@keyframes drop{from{transform:translateY(-40px);opacity:0}}
.bigeq{font-weight:900;font-size:52px;direction:ltr;background:var(--paper);padding:6px 26px;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:pop .5s}
.lcap{font-weight:800;font-size:22px;background:rgba(255,255,255,.88);padding:6px 16px;text-align:center}
.exstage{display:flex;flex-direction:column;align-items:center;gap:12px;min-height:120px}

/* TABLE */
.tgrid{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;width:min(620px,100%);direction:ltr}
.tgrid .hd{display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;background:var(--ink);aspect-ratio:1}
.tcell{position:relative;display:grid;place-items:center;aspect-ratio:1;font-weight:800;font-size:clamp(12px,2.2vw,19px);background:rgba(255,255,255,.55);color:rgba(0,0,0,.35);transition:transform .12s}
.tcell.m{color:#fff;background:var(--c);box-shadow:inset -3px -3px 0 rgba(0,0,0,.2),inset 3px 3px 0 rgba(255,255,255,.3),0 0 10px var(--c)}
.tcell .dv{position:absolute;top:2px;right:2px;width:9px;height:9px;background:#3cc8bb;transform:rotate(45deg);box-shadow:0 0 0 1px #fff}
.tlegend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:16px;background:rgba(255,255,255,.75);padding:6px 14px}
.tlegend span{display:flex;align-items:center;gap:6px}
.tlegend i{display:inline-block;width:16px;height:16px;background:#e4572e}
.tlegend i.d{width:10px;height:10px;background:#3cc8bb;transform:rotate(45deg)}

.overlay{position:absolute;inset:0;z-index:5;display:flex;overflow-y:auto;padding:22px 16px;background:rgba(20,30,40,.6);animation:fadein .4s}
.overlay>*{margin:auto}
.card{display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--paper);padding:22px 36px;max-width:100%;box-shadow:0 0 0 8px var(--grass),0 0 0 14px var(--dirt),0 16px 0 14px rgba(0,0,0,.25)}
.card h2{margin:0;font-size:38px;font-weight:900;text-align:center}
.card .sub{font-weight:800;font-size:20px;color:var(--ink-soft);text-align:center}
.card .stars{display:flex;gap:10px;direction:ltr}
.card .stars span svg{width:74px}
.card .stars span{animation:spin .7s cubic-bezier(.2,.9,.3,1.3) backwards}
@keyframes spin{from{transform:scale(0) rotate(-180deg)}}
.card .cs svg{width:290px;max-width:100%}
.castle .gh{opacity:.15}
.castle .nw{animation:drop .5s backwards}
.final{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;padding:22px 44px 16px;text-align:center;max-width:calc(100% - 40px);box-shadow:0 0 0 10px #8e6fd1,0 0 0 18px #5b3f8c,0 18px 0 18px rgba(0,0,0,.2)}
.final .t1{font-weight:900;font-size:24px;letter-spacing:4px;color:#8e6fd1}
.final .nm{font-weight:900;font-size:clamp(44px,7vw,76px);line-height:1.05}
.final .rl{font-weight:800;font-size:28px;color:var(--blue)}
.final .cs svg{width:290px;max-width:100%}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6}

/* ---------- castle ---------- */
const CASTLE=(()=>{const m=new Map();const set=(x,y,c)=>m.set(x+','+y,c);const stone=(x,y)=>((x+y)%2?'#a7adb4':'#979ea5');
  for(const x0 of [0,22]){for(let y=6;y<=18;y++)for(let x=x0;x<x0+6;x++)set(x,y,stone(x,y));for(const dx of [0,2,3,5])set(x0+dx,5,'#8a9097');}
  for(let y=11;y<=18;y++)for(let x=6;x<=21;x++)set(x,y,stone(x,y));
  for(let x=7;x<=21;x+=2)set(x,10,'#8a9097');
  for(let y=4;y<=10;y++)for(let x=10;x<=17;x++)set(x,y,stone(x,y));
  for(const x of [10,12,15,17])set(x,3,'#8a9097');
  for(let y=15;y<=18;y++)for(let x=12;x<=15;x++)set(x,y,'#6b4423');set(13,14,'#6b4423');set(14,14,'#6b4423');
  for(const [x,y] of [[2,9],[3,9],[2,10],[3,10],[24,9],[25,9],[24,10],[25,10],[13,6],[14,6],[13,7],[14,7],[2,14],[3,14],[24,14],[25,14],[8,13],[19,13]])set(x,y,'#ffd166');
  for(let y=1;y<=4;y++){set(1,y,'#5a5f66');set(26,y,'#5a5f66');}
  set(2,1,'#e4572e');set(3,1,'#e4572e');set(2,2,'#e4572e');set(25,1,'#3a8fc4');set(24,1,'#3a8fc4');set(25,2,'#3a8fc4');
  for(let y=0;y<=2;y++)set(14,y,'#5a5f66');set(15,0,'#ffcf4d');set(16,0,'#ffcf4d');set(15,1,'#ffcf4d');
  return [...m.entries()].map(([k,c])=>{const [x,y]=k.split(',').map(Number);return {x,y,c};}).sort((a,b)=>b.y-a.y||a.x-b.x);})();
function castle(revealed,newFrom=revealed){const U=10;let s=`<svg class="px castle" viewBox="0 0 280 200" aria-hidden="true">`;
  for(let x=0;x<28;x++)s+=`<rect x="${x*U}" y="190" width="10" height="10" fill="#6aa84f"/><rect x="${x*U}" y="190" width="10" height="3" fill="#8acb68"/>`;
  CASTLE.forEach((b,i)=>{const cls=i<revealed?(i>=newFrom?'nw':''):'gh';const st=cls==='nw'?` style="animation-delay:${((i-newFrom)*0.03).toFixed(2)}s"`:'';
    s+=`<g class="${cls}"${st}><rect x="${b.x*U}" y="${b.y*U}" width="10" height="10" fill="${b.c}"/><rect x="${b.x*U}" y="${b.y*U}" width="10" height="2" fill="rgba(255,255,255,.22)"/><rect x="${b.x*U}" y="${b.y*U+8}" width="10" height="2" fill="rgba(0,0,0,.16)"/></g>`;});
  return s+'</svg>';}

/* =====================================================================
   QUESTION DATA. Every question is plain data (so it can be saved for review).
   k:'bin'  {l,op,r,res,miss,ans,t?,f?,pre?}
   k:'add3' {a,b,c,res,ans}
   k:'rem'  {p,d,qq,r}           two answers: quotient, remainder
   k:'col'  {op,a,b,res,g?}      vertical arithmetic, g = guided
   k:'word' {tx,ans,u,h1,st,sp}  word problem
   ===================================================================== */
const B=(l,op,r,miss='res',t)=>{const res=op==='+'?l+r:op==='−'?l-r:op==='×'?l*r:l/r;const q={k:'bin',l,op,r,res,miss,ans:miss==='res'?res:miss==='r'?r:l};if(t)q.t=t;return q;};
const qkey=q=>q.k==='word'?q.tx:JSON.stringify([q.k,q.l,q.op,q.r,q.miss,q.a,q.b,q.c,q.p,q.d]);
function uniq(gen,n){const out=[],seen=new Set();let t=0;while(out.length<n&&t++<800){const q=gen(out.length);const k=qkey(q);if(seen.has(k))continue;seen.add(k);out.push(q);}return out;}
const mix=gens=>i=>pick(gens)(i);
const mm=(p)=>Math.random()<p;

/* ---- addition ---- */

  dbl:()=>{if(mm(.5)){const a=rand(2,10);return B(a,'+',a,'res','dbl');}const a=rand(2,9);return mm(.5)?B(a,'+',a+1,'res','near'):B(a+1,'+',a,'res','near');},
  make10:()=>{const a=rand(3,9),b=rand(11-a,9);return B(a,'+',b);},
  to20:()=>{const a=rand(2,12),b=rand(2,Math.min(9,20-a));return B(a,'+',b,mm(.4)?(mm(.5)?'r':'l'):'res');},
  three:()=>{const x=rand(1,9),y=10-x,z=rand(2,9);const arr=shuffle([x,y,z]);return {k:'add3',a:arr[0],b:arr[1],c:arr[2],res:20-10+z,ans:10+z};},
  tens:()=>{const a=10*rand(1,8),b=10*rand(1,9-a/10);return B(a,'+',b,mm(.25)?'r':'res');},
  a21:()=>{let a;do{a=rand(11,88);}while(a%10>8);return B(a,'+',rand(1,9-a%10));},

  plus9:()=>{const b=mm(.7)?9:19;const a=rand(11,99-b);return B(a,'+',b,'res',b===9?'p9':'p19');},
  a22:()=>{const at=rand(1,7),a1=rand(0,8),bt=rand(1,8-at),b1=rand(0,9-a1);return B(at*10+a1,'+',bt*10+b1,mm(.15)?'r':'res');},
  a22c:()=>{const a1=rand(2,9),b1=rand(10-a1,9),at=rand(1,7),bt=rand(1,8-at);return B(at*10+a1,'+',bt*10+b1,mm(.15)?'r':'res');},
  c100:()=>{let a;do{a=rand(11,89);}while(a%10===0&&mm(.7));return mm(.7)?B(a,'+',100-a,'r','c100'):B(100-a,'+',a,'l','c100');},
  hund:()=>{if(mm(.5)){const a=rand(1,8),b=rand(1,9-a);return B(a*100,'+',b*100,mm(.2)?'r':'res');}const a=rand(1,7)*100+rand(1,9)*10,b=rand(1,9-Math.ceil(a/100))*100;return B(a,'+',b);},
  col2:i=>{let a,b,s;do{a=rand(12,89);b=rand(12,89);s=a+b;}while(a%10+b%10<10||(s>99&&mm(.7))||s>198);const q={k:'col',op:'+',a,b,res:s};if(i<3)q.g=1;return q;},
  col3:i=>{let a,b,s,ok;do{a=rand(100,899);b=mm(.4)?rand(12,99):rand(100,599);s=a+b;ok=s<=999&&(a%10+b%10>=10||(a%100)+(b%100)>=100);}while(!ok);const q={k:'col',op:'+',a,b,res:s};if(i<2)q.g=1;return q;}

const GS={

  s22b:()=>{const at=rand(3,9),a1=rand(0,8),b1=rand(a1+1,9),bt=rand(1,at-2);return B(at*10+a1,'−',bt*10+b1);},

/* ---- multiplication & division ---- */

/* ---- word problems ---- */
const NAMES=[['אוֹרֶן','m'],['נוֹעָה','f'],['דָּנִי','m'],['מָאיָה','f'],['יוֹנָתָן','m'],['תָּמָר','f'],['אִיתַי','m'],['שִׁירָה','f'],['עִדּוֹ','m'],['יָעֵל','f']];

const nb=n=>`<b>${n}</b>`;
const noDag=s=>s.replace(/^(.[\u0591-\u05C7]*?)\u05BC/,'$1');
const lp=(nm)=>'לְ'+noDag(nm[0]);
const two=()=>{const a=pick(NAMES);let b;do{b=pick(NAMES);}while(b===a);return [a,b];};
const W=(tx,ans,u,h1,st)=>({k:'word',tx,ans,u,h1,st});
const WP={
  join:(lo,hi)=>()=>{const n=pick(NAMES),X=pick(ITEMS),g=(m,f)=>n[1]==='m'?m:f;const s=rand(lo,hi),a=rand(Math.max(2,Math.floor(s/4)),s-2),b=s-a;
    const t=rand(1,4);
    if(t===1)return W(`${lp(n)} הָיוּ ${nb(a)} ${X}. ${n[0]} ${g('קִבֵּל','קִבְּלָה')} עוֹד ${nb(b)} ${X}. כַּמָּה ${X} יֵשׁ ${g('לוֹ','לָהּ')} עַכְשָׁו?`,s,X,'"עוֹד" ← חִבּוּר',[`${a} + ${b} = ?`]);
    if(t===2)return W(`${n[0]} ${g('מָצָא','מָצְאָה')} ${nb(a)} ${X} בַּבֹּקֶר, וְעוֹד ${nb(b)} ${X} בָּעֶרֶב. כַּמָּה ${X} ${g('הוּא מָצָא','הִיא מָצְאָה')} בְּסַךְ הַכֹּל?`,s,X,'"בְּסַךְ הַכֹּל" ← חִבּוּר',[`${a} + ${b} = ?`]);
    if(t===3){const [p,q]=two();const them=p[1]==='f'&&q[1]==='f'?'לָהֶן':'לָהֶם';return W(`${lp(p)} יֵשׁ ${nb(a)} ${X}, וּ${lp(q)} יֵשׁ ${nb(b)} ${X}. כַּמָּה ${X} יֵשׁ ${them} בְּיַחַד?`,s,X,'"בְּיַחַד" ← חִבּוּר',[`${a} + ${b} = ?`]);}
    return W(`בָּאוֹטוֹבּוּס יָשְׁבוּ ${nb(a)} נוֹסְעִים. בַּתַּחֲנָה עָלוּ עוֹד ${nb(b)} נוֹסְעִים. כַּמָּה נוֹסְעִים יֵשׁ עַכְשָׁו בָּאוֹטוֹבּוּס?`,s,'נוֹסְעִים','"עָלוּ עוֹד" ← חִבּוּר',[`${a} + ${b} = ?`]);},
  take:(lo,hi)=>()=>{const n=pick(NAMES),X=pick(ITEMS),g=(m,f)=>n[1]==='m'?m:f;const a=rand(lo,hi),b=rand(2,a-2),r=a-b;const t=rand(1,5);
    if(t===1)return W(`${lp(n)} הָיוּ ${nb(a)} ${X}. ${g('הוּא נָתַן','הִיא נָתְנָה')} ${nb(b)} ${X} לְחָבֵר. כַּמָּה ${X} נִשְׁאֲרוּ ${g('לוֹ','לָהּ')}?`,r,X,'"נָתַן" וְ"נִשְׁאֲרוּ" ← חִסּוּר',[`${a} − ${b} = ?`]);
    if(t===2)return W(`עַל הָעֵץ הָיוּ ${nb(a)} תַּפּוּחִים. ${nb(b)} תַּפּוּחִים נָפְלוּ. כַּמָּה תַּפּוּחִים נִשְׁאֲרוּ עַל הָעֵץ?`,r,'תַּפּוּחִים','"נָפְלוּ" ← חִסּוּר',[`${a} − ${b} = ?`]);
    if(t===3){const E=pick(EAT);return W(`בַּצַּלַּחַת הָיוּ ${nb(a)} ${E}. ${n[0]} ${g('אָכַל','אָכְלָה')} ${nb(b)} ${E}. כַּמָּה ${E} נִשְׁאֲרוּ בַּצַּלַּחַת?`,r,E,'"אָכַל" ← חִסּוּר',[`${a} − ${b} = ?`]);}

    return W(`בַּסֵּפֶר יֵשׁ ${nb(a)} עַמּוּדִים. ${n[0]} ${g('קָרָא','קָרְאָה')} ${nb(b)} עַמּוּדִים. כַּמָּה עַמּוּדִים ${g('נִשְׁאֲרוּ לוֹ','נִשְׁאֲרוּ לָהּ')} לִקְרֹא?`,r,'עַמּוּדִים','מַה שֶּׁנִּשְׁאַר ← חִסּוּר',[`${a} − ${b} = ?`]);},
  cmp:(lo,hi)=>()=>{const [p,q]=two(),X=pick(ITEMS),g1=(m,f)=>p[1]==='m'?m:f,g2=(m,f)=>q[1]==='m'?m:f;const a=rand(lo,hi),b=rand(Math.max(2,Math.floor(a/3)),a-2),d=a-b;const t=rand(1,4);
    if(t===1)return W(`${lp(p)} יֵשׁ ${nb(a)} ${X}, וּ${lp(q)} יֵשׁ ${nb(b)} ${X}. כַּמָּה ${X} יֵשׁ ${lp(p)} יוֹתֵר מֵאֲשֶׁר ${lp(q)}?`,d,X,'"כַּמָּה יוֹתֵר?" ← הַגָּדוֹל פָּחוֹת הַקָּטָן',[`${a} − ${b} = ?`]);
    if(t===2)return W(`${p[0]} ${g1('בָּנָה','בָּנְתָה')} מִגְדָּל שֶׁל ${nb(a)} בְּלוֹקִים. ${q[0]} ${g2('בָּנָה','בָּנְתָה')} מִגְדָּל שֶׁל ${nb(b)} בְּלוֹקִים. בְּכַמָּה בְּלוֹקִים הַמִּגְדָּל שֶׁל ${p[0]} גָּבוֹהַּ יוֹתֵר?`,d,'בְּלוֹקִים','הַהֶפְרֵשׁ ← הַגָּדוֹל פָּחוֹת הַקָּטָן',[`${a} − ${b} = ?`]);
    if(t===3)return W(`${lp(p)} יֵשׁ ${nb(a)} ${X}. ${lp(q)} יֵשׁ ${nb(d)} ${X} פָּחוֹת. כַּמָּה ${X} יֵשׁ ${lp(q)}?`,b,X,'"פָּחוֹת" ← חִסּוּר',[`${a} − ${d} = ?`]);

const landOpen=L=>L.id!=='fin'||unlocked(L.units[0]);
const markFact=(k,n,bit)=>{for(const key of [k+'x'+n,n+'x'+k])save.m[key]=(save.m[key]|0)|bit;};
const masteredCount=()=>{let c=0;for(let a=1;a<=10;a++)for(let b=1;b<=10;b++)if((save.m[a+'x'+b]|0)&1)c++;return c;};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function dayStreak(){const set=new Set(save.days);let n=0;const d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(!set.has(k))break;n++;d.setDate(d.getDate()-1);}return n;}

/* ---------- audio ---------- */
let ac=null,master=null,musicBus=null,musicTimer=null;
function audio(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);musicBus=ac.createGain();musicBus.gain.value=.8;musicBus.connect(master);}if(ac.state==='suspended')ac.resume();return ac;}
function tone(f,t0,dur,type='sine',vol=.12,bus){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(bus||master);o.start(t0);o.stop(t0+dur+.05);}
const now=()=>{const a=audio();return a?a.currentTime:0;};
const sfx={key(){tone(700,now(),.05,'square',.03);},pop(i=1){tone(420+i*25,now(),.12,'square',.04);},
  ok(s=0){const t=now(),b=1+Math.min(s,8)*.06;tone(660*b,t,.22,'triangle',.13);tone(990*b,t+.1,.35,'triangle',.13);},
  no(){const t=now();tone(240,t,.22,'sine',.12);tone(190,t+.13,.3,'sine',.1);},
  hit(){const t=now();tone(140,t,.25,'square',.08);tone(90,t+.05,.3,'sawtooth',.05);},
  win(){const t=now();[523,659,784,1046,1318].forEach((f,i)=>tone(f,t+i*.11,.6,'triangle',.12));},
  star(i){tone(880+i*220,now(),.4,'triangle',.12);},
  build(){const t=now();for(let i=0;i<8;i++)tone(300+i*40,t+i*.06,.08,'square',.03);},
  carry(){const t=now();tone(880,t,.1,'square',.04);tone(1320,t+.08,.15,'square',.04);}};
const NOTES=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];const BASS=[130.81,98,110,87.31];let beat=0;
function musicStart(){if(musicTimer||!save.music||!audio())return;musicTimer=setInterval(()=>{const t=now();if(beat%4===0)tone(BASS[(beat/4)%4|0],t,3.6,'sine',.045,musicBus);if(Math.random()<.6)tone(NOTES[rand(0,7)],t,2.2,'triangle',.025,musicBus);beat++;},1000);}
function musicStop(){clearInterval(musicTimer);musicTimer=null;}
function duck(on){if(musicBus&&ac)musicBus.gain.setTargetAtTime(on?.3:.8,ac.currentTime,.2);}

/* ---------- speech (sparingly) ---------- */
let heVoice=null,sayNow='';
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices().filter(v=>/^(he|iw)/i.test(v.lang));heVoice=vs.find(v=>/Hila/i.test(v.name))||vs.find(v=>/Avri/i.test(v.name))||vs.find(v=>/Natural|Online/i.test(v.name))||vs[0]||null;$('#voiceNote').hidden=!!heVoice;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;setTimeout(pickVoice,1500);}else $('#voiceNote').hidden=false;
function say(t){if(!('speechSynthesis' in window)||!t||window.__fast)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(t));u.lang='he-IL';if(heVoice)u.voice=heVoice;u.rate=.92;u.pitch=1.05;u.onstart=()=>duck(true);u.onend=u.onerror=()=>duck(false);speechSynthesis.speak(u);}
const hush=()=>{try{speechSynthesis.cancel();}catch(e){}};

/* ---------- confetti ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function fit(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;}addEventListener('resize',fit);fit();
const PC=['#ffcf4d','#4fbf63','#3cc8bb','#ff7eb6','#e4572e','#8ccbea','#ffffff'];
function burst(x,y,n=24,sp=1,cols=PC){if(matchMedia('(prefers-reduced-motion: reduce)').matches||window.__fast)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(2+Math.random()*6)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,sz:6+Math.random()*8,c:cols[i%cols.length],life:70+Math.random()*40,r:Math.random()*6});}if(!raf)raf=requestAnimationFrame(tick);}
function rain(){const w=cv.clientWidth;for(let i=0;i<5;i++)setTimeout(()=>burst(Math.random()*w,cv.clientHeight*.35,36,1.4),i*220);}
function tick(){const d=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life>0);parts.forEach(p=>{p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.life--;p.r+=.1;cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;cx.fillRect(-p.sz*d/2,-p.sz*d/2,p.sz*d,p.sz*d);cx.restore();});raf=parts.length?requestAnimationFrame(tick):0;}
const center=el=>{const r=el.getBoundingClientRect(),c=cv.getBoundingClientRect();return [r.left+r.width/2-c.left,r.top+r.height/2-c.top];};

/* ---------- hint visuals ---------- */
function frames(cells){const nF=Math.max(1,Math.ceil(cells.length/10));let s='<div class="tf">';for(let f=0;f<nF;f++){s+='<div class="frame">';for(let i=0;i<10;i++)s+=`<i class="${cells[f*10+i]||''}"></i>`;s+='</div>';}return s+'</div>';}
function baseTen(n,c){const hh=n/100|0,t=(n%100)/10|0,o=n%10;let s=`<div class="btwrap"><div class="btn10" style="--c:${c}">`;
  for(let i=0;i<hh;i++)s+='<div class="flat">'+'<i></i>'.repeat(100)+'</div>';
  for(let i=0;i<t;i++)s+='<div class="rod">'+'<i></i>'.repeat(10)+'</div>';
  if(o)s+='<div class="ones">'+'<i class="one"></i>'.repeat(o)+'</div>';return s+`</div><div class="btlbl">${n}</div></div>`;}
function arr(rows,cols,sz=18){let s=`<div class="arr" style="--s:${sz}px">`;for(let r=0;r<rows;r++)s+=`<div class="r"><small>${r+1}</small>${`<i style="--c:${COLORS[r%10]}"></i>`.repeat(cols)}</div>`;return s+'</div>';}
function skipS(k,count,hideLast){let s='<div class="skip">';for(let i=1;i<=count;i++)s+=(hideLast&&i===count)?`<b class="q">?<small>${i}</small></b>`:`<b>${k*i}<small>${i}</small></b>`;return s+'</div>';}
function share(k,n){let s='<div class="share">';for(let i=0;i<k;i++)s+=`<div class="box">${SPR.gem.repeat(n)}</div>`;return s+'</div>';}
const steps=lines=>`<div class="steps">${lines.map(l=>`<div>${l.replace('?','<b>?</b>')}</div>`).join('')}</div>`;
const cap=t=>`<div class="cap">${t}</div>`;
const L_=t=>`<span class="ltr">${t}</span>`;
const sz=(a,b)=>Math.max(a,b)>=8?14:18;

/* returns {v: visual/caption html (level 1), s: step lines (level 2)} */
function hintData(q){
  if(q.k==='add3'){const {a,b,c}=q;let p;if(a+b===10)p=[`${a} + ${b} = 10`,`10 + ${c} = ?`];else if(b+c===10)p=[`${b} + ${c} = 10`,`10 + ${a} = ?`];else if(a+c===10)p=[`${a} + ${c} = 10`,`10 + ${b} = ?`];else p=[`${a} + ${b} = ${a+b}`,`${a+b} + ${c} = ?`];
    return {v:cap('מְחַפְּשִׂים זוּג שֶׁל 10')+frames([...Array(a).fill('a'),...Array(b).fill('b'),...Array(c).fill('c')]),s:p};}
  if(q.k==='rem'){const {p,d,qq,r}=q;return {v:cap(`כַּמָּה פְּעָמִים ${L_(d)} נִכְנָס בְּ-${L_(p)}?`)+skipS(d,Math.max(qq,1),false),s:[`${qq} × ${d} = ${qq*d}`,`${p} − ${qq*d} = ${r}`]};}
  const {l,r,res,op,miss,t}=q;
  if(op==='+'){
    if(miss!=='res'){const known=miss==='r'?l:r;
      if(t==='c100'){const up=Math.ceil(known/10)*10;return {v:cap(`כַּמָּה חָסֵר מִ-${L_(known)} עַד 100?`)+`<div class="bt">${baseTen(known,'#e8873a')}</div>`,s:known%10?[`${known} + ${up-known} = ${up}`,`${up} + ${100-up} = 100`,`${up-known} + ${100-up} = ?`]:[`100 − ${known} = ?`]};}
      if(res<=20)return {v:cap('כַּמָּה רִבּוּעִים רֵיקִים?')+frames([...Array(known).fill('a'),...Array(res-known).fill('e')]),s:[`${res} − ${known} = ?`]};
      return {v:cap(`מִ-${L_(known)} עַד ${L_(res)}: כַּמָּה חָסֵר?`)+`<div class="bt">${baseTen(known,'#e8873a')}${baseTen(res,'#3a8fc4')}</div>`,s:[`${res} − ${known} = ?`]};}
    if(t==='dbl')return {v:cap('כָּפוּל: אוֹתוֹ מִסְפָּר פַּעֲמַיִם')+frames([...Array(l).fill('a'),...Array(r).fill('b')]),s:[`${l} + ${l} = ?`]};
    if(t==='near'){const m=Math.min(l,r);return {v:cap('כִּמְעַט כָּפוּל!')+frames([...Array(l).fill('a'),...Array(r).fill('b')]),s:[`${m} + ${m} = ${2*m}`,`${2*m} + 1 = ?`]};}
    if(t==='p9'||t==='p19'){const nine=t==='p9'?9:19,big=r===nine?l:r,add=t==='p9'?10:20;return {v:cap(`${L_(t==='p9'?'9 = 10 − 1':'19 = 20 − 1')}`),s:[`${big} + ${add} = ${big+add}`,`${big+add} − 1 = ?`]};}
    if(res<=20&&l<10&&r<10&&res>10){const big=Math.max(l,r),small=Math.min(l,r),need=10-big;return {v:cap('מַשְׁלִימִים לְ-10')+frames([...Array(l).fill('a'),...Array(r).fill('b')]),s:[`${big} + ${need} = 10`,`10 + ${small-need} = ?`]};}
    if(res<=20)return {v:cap('סוֹפְרִים אֶת כֻּלָּם')+frames([...Array(l).fill('a'),...Array(r).fill('b')]),s:[`${l} + ${r} = ?`]};
    if(res>=100&&l%100===0&&r%100===0)return {v:cap('מֵאוֹת וְעוֹד מֵאוֹת')+`<div class="bt">${baseTen(l,'#e8873a')}${baseTen(r,'#3a8fc4')}</div>`,s:[`${l/100} + ${r/100} = ${res/100}`,`${l/100} מֵאוֹת + ${r/100} מֵאוֹת = ?`].slice(0,1).concat([`${l} + ${r} = ?`])};
    if(res>=100){const H=(l-l%100)+(r-r%100),rest=l%100+r%100;return {v:cap('מֵאוֹת עִם מֵאוֹת')+`<div class="bt">${baseTen(l,'#e8873a')}${baseTen(r,'#3a8fc4')}</div>`,s:[`${l-l%100} + ${r-r%100} = ${H}`,`${H} + ${rest} = ?`]};}
    const small=Math.min(l,r),big=Math.max(l,r);
    if(small<10&&big%10+small>=10){const up=tens(big)+10;return {v:cap('מַשְׁלִימִים לָעֶשֶׂרֶת הַבָּאָה')+`<div class="bt">${baseTen(big,'#e8873a')}${baseTen(small,'#3a8fc4')}</div>`,s:[`${big} + ${up-big} = ${up}`,`${up} + ${small-(up-big)} = ?`]};}
    const T=tens(l)+tens(r),O=l%10+r%10;
    let s;
    if(small>=10&&small%10===0)s=big%10?[`${tens(big)} + ${small} = ${tens(big)+small}`,`${tens(big)+small} + ${big%10} = ?`]:[`${big} + ${small} = ?`];
    else if(tens(l)&&tens(r))s=O?[`${tens(l)} + ${tens(r)} = ${T}`,`${l%10} + ${r%10} = ${O}`,`${T} + ${O} = ?`]:[`${tens(l)} + ${tens(r)} = ${T}`,`${T} + 0 = ?`].slice(0,1).map(()=>`${tens(l)} + ${tens(r)} = ?`);
    else s=[`${l%10} + ${r%10} = ${O}`,`${T} + ${O} = ?`];
    return {v:cap('קֹדֶם עֲשָׂרוֹת, אַחַר כָּךְ אֲחָדוֹת')+`<div class="bt">${baseTen(l,'#e8873a')}${baseTen(r,'#3a8fc4')}</div>`,s};
  }
  if(op==='−'){
    if(miss!=='res'){if(l<=20)return {v:cap(`כַּמָּה צָרִיךְ לִמְחֹק כְּדֵי שֶׁיִּשָּׁאֲרוּ ${L_(res)}?`)+frames([...Array(res).fill('b'),...Array(l-res).fill('a')]),s:[`${l} − ${res} = ?`]};
      return {v:cap(`מִ-${L_(l)} צָרִיךְ לָרֶדֶת עַד ${L_(res)}`)+`<div class="bt">${baseTen(l,'#e8873a')}</div>`,s:[`${l} − ${res} = ?`]};}
    if(t==='m9'||t==='m19'){const sub=t==='m9'?10:20;return {v:cap(L_(t==='m9'?'9 = 10 − 1':'19 = 20 − 1')),s:[`${l} − ${sub} = ${l-sub}`,`${l-sub} + 1 = ?`]};}
    if(l<=20){const o=l%10,v=cap('מוֹחֲקִים וְסוֹפְרִים מַה נִּשְׁאַר')+frames([...Array(l-r).fill('a'),...Array(r).fill('x')]);
      if(l>10&&r<=o)return {v,s:[`${o} − ${r} = ${o-r}`,`${l-o} + ${o-r} = ?`]};
      if(l>10&&o>0&&r>o)return {v,s:[`${l} − ${o} = ${l-o}`,`${l-o} − ${r-o} = ?`]};
      return {v,s:[`${l} − ${r} = ?`]};}
    if(l>=100&&l%100===0&&r%100===0)return {v:cap('מֵאוֹת פָּחוֹת מֵאוֹת')+`<div class="bt">${baseTen(l,'#e8873a')}</div>`,s:[`${l/100} − ${r/100} = ${(l-r)/100}`,`${l} − ${r} = ?`]};
    if(l>=100){const bv=`<div class="bt">${baseTen(l,'#e8873a')}</div>`;
      if(r%100===0)return {v:cap('מוֹרִידִים רַק מֵאוֹת')+bv,s:[`${l-l%100} − ${r} = ${l-l%100-r}`,`${l-l%100-r} + ${l%100} = ?`]};
      if(r%10===0)return {v:cap('מוֹרִידִים עֲשָׂרוֹת')+bv,s:[`${l} − ${r} = ?`]};
      if(r<10)return {v:cap('מוֹרִידִים אֲחָדוֹת')+bv,s:[`${l} − ${r} = ?`]};
      return {v:cap('מוֹרִידִים קֹדֶם עֲשָׂרוֹת, אַחַר כָּךְ אֲחָדוֹת')+bv,s:[`${l} − ${tens(r)} = ${l-tens(r)}`,`${l-tens(r)} − ${r%10} = ?`]};}
    const cap1=r<10?`מוֹרִידִים מִ-${L_(l)} רַק אֲחָדוֹת`:`מוֹרִידִים מִ-${L_(l)} קֹדֶם ${L_(tens(r)||r)}`;
    const v=cap(cap1)+`<div class="bt">${baseTen(l,'#e8873a')}</div>`;
    if(tens(r)&&r%10)return {v,s:[`${l} − ${tens(r)} = ${l-tens(r)}`,`${l-tens(r)} − ${r%10} = ?`]};
    if(!tens(r)&&r<=l%10)return {v,s:[`${l%10} − ${r} = ${l%10-r}`,`${tens(l)} + ${l%10-r} = ?`]};
    if(!tens(r)&&r>l%10)return l%10?{v,s:[`${l} − ${l%10} = ${tens(l)}`,`${tens(l)} − ${r-l%10} = ?`]}:{v,s:[`10 − ${r} = ${10-r}`,`${l-10} + ${10-r} = ?`]};
    return {v,s:[`${tens(l)} − ${tens(r)} = ${tens(l)-tens(r)}`,`${tens(l)-tens(r)} + ${l%10} = ?`]};
  }
  if(op==='×'){

    if(l===0||r===0)return {v:cap('כָּל מִסְפָּר כָּפוּל 0 הוּא 0'),s:[`${l} × ${r} = ?`]};
    if(l===1||r===1)return {v:cap('כָּל מִסְפָּר כָּפוּל 1 נִשְׁאָר אוֹתוֹ מִסְפָּר'),s:[`${l} × ${r} = ?`]};
    if(t==='x10'){const k=l%10===0?r:l,tt=l%10===0?l:r;return {v:cap(`${L_(k+' × '+tt/10+' = '+k*tt/10)} ← וְעַכְשָׁו פִּי 10`),s:[`${k} × ${tt/10} = ${k*tt/10}`,`${k*tt/10} × 10 = ?`]};}
    if(t==='x21'){const big=l>10?l:r,k=l>10?r:l,t0=tens(big),u=big%10;return {v:cap(`מְפָרְקִים אֶת ${L_(big)} לַעֲשָׂרוֹת וַאֲחָדוֹת`)+`<div class="bt">${baseTen(big,'#e8873a')}</div>`,s:u?[`${t0} × ${k} = ${t0*k}`,`${u} × ${k} = ${u*k}`,`${t0*k} + ${u*k} = ?`]:[`${t0} × ${k} = ?`]};}
    return {v:cap(`${L_(l)} קְבוּצוֹת שֶׁל ${L_(r)}`)+arr(l,r,sz(l,r)),s:[]};
  }
  // division
  if(miss==='r')return {v:cap(`${L_('? × '+res+' = '+l)}<br>קְפִיצוֹת שֶׁל ${L_(res)} עַד ${L_(l)}. כַּמָּה קְפִיצוֹת?`)+skipS(res,l/res,false),s:[`${l} : ${res} = ?`]};
  if(t==='d21'){const big=res,t0=tens(big),u=big%10;return {v:cap(`מְפָרְקִים אֶת ${L_(l)}`)+`<div class="bt">${baseTen(l,'#e8873a')}</div>`,s:u?[`${t0*r} : ${r} = ${t0}`,`${u*r} : ${r} = ${u}`,`${t0} + ${u} = ?`]:[`${l/10} : ${r} = ${res/10}`,`${res/10} × 10 = ?`]};}
  return {v:cap(`${L_(r+' × ? = '+l)}<br>קְפִיצוֹת שֶׁל ${L_(r)} עַד ${L_(l)}. כַּמָּה קְפִיצוֹת?`)+skipS(r,res,false),s:[]};
}
function hintHTML(q,level){

/* ---------- column arithmetic ---------- */
const digs=n=>String(n).split('').reverse().map(Number);
function colInit(q){const A=digs(q.a),Bd=digs(q.b),R=digs(q.res);return {A,B:Bd,R,W:Math.max(A.length,Bd.length,R.length),tops:A.slice(),marks:{},carries:{},typed:[],c:0,ct:0,state:[]};}
function colNeedBorrow(st,c){return (st.tops[c]|0)<(st.B[c]|0);}
function colBorrow(st,c){st.tops[c]+=10;st.marks[c]=st.tops[c];let j=c+1;while(st.tops[j]===0){st.tops[j]=9;st.marks[j]=9;j++;}st.tops[j]-=1;st.marks[j]=st.tops[j];sfx.carry();}
function colCarryIn(st,c){return st.carries[c]|0;}
function colHint(q,st){const c=st.c;
  if(q.op==='+'){const a=st.A[c]|0,b=st.B[c]|0,ci=colCarryIn(st,c);if(c>=st.A.length&&c>=st.B.length)return cap('מוֹרִידִים אֶת הַ-1 לְמַטָּה');
    const s=a+b+ci;return steps([`${a} + ${b}${ci?' + 1':''} = ${s}`])+cap(s>=10?`כּוֹתְבִים ${L_(s%10)} וּמַעֲבִירִים 1`:`כּוֹתְבִים ${L_(s)}`);}
  if(colNeedBorrow(st,c)){const old=st.tops[c];colBorrow(st,c);renderCol(q,st);return cap(`${L_(old)} קָטָן מִ-${L_(st.B[c])} ← לוֹוִים 10`)+steps([`${st.tops[c]} − ${st.B[c]|0} = ?`]);}
  return steps([`${st.tops[c]} − ${st.B[c]|0} = ?`]);}
function renderCol(q,st){
  const box=$('#colw');if(!box)return;const W=st.W;box.style.gridTemplateColumns=`repeat(${W+1},var(--cw))`;let s='';
  const gi=c=>W-c; // grid index from left (sign column is 0)
  const cell=(content,cls='')=>`<div class="cc ${cls}">${content}</div>`;
  // marks row
  s+=cell('','mk');for(let g=1;g<=W;g++){const c=W-g;const m=q.op==='+'?(st.carries[c]?'1':''):(st.marks[c]!=null?st.marks[c]:'');s+=cell(m,'mk'+(q.op==='+'?' cr':''));}
  s+=cell('');for(let g=1;g<=W;g++){const c=W-g;s+=cell(c<st.A.length?st.A[c]:'',st.marks[c]!=null?'x':'');}
  s+=cell(q.op,'op');for(let g=1;g<=W;g++){const c=W-g;s+=cell(c<st.B.length?st.B[c]:'');}
  s+='<div class="cline"></div>';
  s+='<div class="cempty"></div>';for(let g=1;g<=W;g++){const c=W-g;if(c>=st.R.length){s+='<div class="cempty"></div>';continue;}
    const v=st.typed[c];const cls=v!=null?(st.state[c]==='show'?'show':'ok'):(c===st.c?'cur':'');s+=`<div class="cb ${cls}" id="cb${c}">${v!=null?v:''}</div>`;}
  box.innerHTML=s;
}
function colPrep(q,st){if(q.op==='−'&&q.g&&st.c<st.R.length&&colNeedBorrow(st,st.c)){colBorrow(st,st.c);}renderCol(q,st);
  const hb=$('#hint');if(q.g&&hb&&st.c<st.R.length){hb.hidden=false;hb.innerHTML=colHint(q,st);}}
function colAdvance(q,st,digit,shown){const c=st.c;st.typed[c]=digit;st.state[c]=shown?'show':'ok';
  if(q.op==='+'){const s=(st.A[c]|0)+(st.B[c]|0)+colCarryIn(st,c);if(s>=10){st.carries[c+1]=1;sfx.carry();}}
  else if(colNeedBorrow(st,c)){colBorrow(st,c);}
  st.c++;st.ct=0;
}

  return '';
}
function questionHTML(q,isStatic,solved){
  const box=(v,i)=>solved?`<span class="ans show">${v}</span>`:`<span class="ans empty" data-b="${i}">?</span>`;
  if(q.k==='word')return `<div class="wcard">${q.tx}</div><div class="wans">תְּשׁוּבָה: ${box(q.ans,0)} <span>${q.u}</span></div>`;

  return preHTML(q)+`<div class="eqcard">${cell(q.l,'l')}<span class="op">${q.op}</span>${cell(q.r,'r')}<span class="op">=</span>${cell(q.res,'res')}</div>`;

const answersOf=q=>q.k==='rem'?[q.qq,q.r]:[q.ans];
function qSpeech(q){
  if(q.k==='word')return q.tx;

  const qa=h('div','qarea');qa.id='qa';
  const hintRow=h('div','hintrow');const hb=h('button','hintbtn',ICON.bulb+'<span>רֶמֶז</span>');hb.id='hintBtn';hb.onclick=()=>showHint(true);hintRow.appendChild(hb);
  if(!u.boss&&!u.train&&(u.lesson||u.table||u.div)){const lb=h('button','hintbtn lsn',ICON.booki+'<span>לִמּוּד</span>');lb.onclick=()=>openLesson(u);hintRow.appendChild(lb);}
  const hintbox=h('div','hintbox');hintbox.id='hint';hintbox.hidden=true;
  left.append(top,qa,hintRow,hintbox);
  const pad=h('div','pad');
  ['1','2','3','4','5','6','7','8','9','del','0','go'].forEach(k=>{const b=h('button','key'+(k==='go'?' go':''),k==='del'?ICON.del:k==='go'?ICON.check:k);b.dataset.k=k;b.setAttribute('aria-label',k==='del'?'מחק':k==='go'?'בדוק':k);b.onclick=()=>press(k);pad.appendChild(b);});
  wrap.append(left,pad);s.appendChild(wrap);
  const bub=$('#bubble');if(bub)bub.onclick=()=>say(sayNow);
  if(u.boss){sayNow=u.final?'טירת האלופים! הענק הגדול מכולם.':'ענק הבלוקים! כל תשובה נכונה מורידה לו בלוק.';say(sayNow);}
  showQ();
}
function hudPlay(){const p=play;const nm=p.u.train?'אִמּוּן יוֹמִי':p.u.boss?p.u.name:p.u.land.name;
  $('#hudMid').innerHTML=`<div class="chip">${nm}</div><div class="progress">${p.qs.map((_,k)=>`<i class="pb${k<p.i?' on':k===p.i?' cur':''}"></i>`).join('')}</div>${p.streak>=2?`<div class="streak">${SPR.flame}${p.streak}</div>`:''}`;}
function setBubble(t){const b=$('#bText');if(b)b.innerHTML=t;}
function showQ(){
  const p=play;const q=p.qs[p.i];p.tries=0;p.hint=0;p.lock=false;p.col=null;
  const qa=$('#qa');
  if(q.k==='col'){qa.innerHTML=`<div class="colwrap" id="colw"></div>`;p.col=colInit(q);}
  else{qa.innerHTML=questionHTML(q);p.boxes=[...qa.querySelectorAll('.ans')].map((el,i)=>({el,val:'',ans:answersOf(q)[i],done:false}));p.bi=0;
    p.boxes.forEach((b,i)=>b.el.onclick=()=>{if(!b.done){p.bi=i;renderBoxes();}});renderBoxes();}
  qa.style.animation='none';void qa.offsetWidth;qa.style.animation='fadein .35s';
  $('#hint').hidden=true;$('#hint').innerHTML='';$('#hintBtn').hidden=false;
  if(q.k==='col'){colPrep(q,p.col);}
  setBubble(q.k==='word'?'קְרָא וְחַשֵּׁב':q.k==='col'?'מַתְחִילִים מִיָּמִין':q.k==='rem'?'כַּמָּה, וּמָה הַשְּׁאֵרִית?':q.miss&&q.miss!=='res'?'מַה חָסֵר?':'כַּמָּה זֶה?');
  sayNow=qSpeech(q);hudPlay();
}
function renderBoxes(){const p=play;p.boxes.forEach((b,i)=>{if(b.done)return;b.el.className='ans'+(b.val?'':' empty')+(i===p.bi&&p.boxes.length>1?' foc':'');b.el.textContent=b.val||'?';});}
function press(k){
  const p=play;if(!p||p.lock)return;
  const kb=document.querySelector(`.key[data-k="${k}"]`);if(kb){kb.classList.add('press');setTimeout(()=>kb.classList.remove('press'),120);}
  const q=p.qs[p.i];
  if(q.k==='col'){if(/^\d$/.test(k))colType(+k);return;}
  const b=p.boxes[p.bi];if(!b)return;
  if(k==='del'){b.val=b.val.slice(0,-1);sfx.key();renderBoxes();return;}
  if(k==='go'){if(!b.val)return;const nxt=p.boxes.findIndex((x,i)=>!x.done&&!x.val&&i!==p.bi);if(nxt>=0){p.bi=nxt;renderBoxes();return;}submit();return;}
  if(b.val.length>=4)return;if(b.val==='0')b.val='';b.val+=k;sfx.key();renderBoxes();
}
addEventListener('keydown',e=>{if(!play||$('#sPlay').hidden||!$('#ov').hidden)return;
  if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace'){e.preventDefault();press('del');}else if(e.key==='Enter'){e.preventDefault();press('go');}
  else if(e.key==='Tab'&&play.boxes.length>1){e.preventDefault();const p=play;let i=p.bi;do{i=(i+1)%p.boxes.length;}while(p.boxes[i].done&&i!==p.bi);p.bi=i;renderBoxes();}});
function showHint(manual){
  const p=play;if(!p||p.lock)return;const q=p.qs[p.i];const hb=$('#hint');
  if(q.k==='col'){if(manual)p.hints++;hb.hidden=false;hb.innerHTML=colHint(q,p.col);setBubble('הִנֵּה רֶמֶז');return;}
  if(p.hint>=2)return;p.hint++;if(manual)p.hints++;
  hb.hidden=false;hb.innerHTML=hintHTML(q,p.hint);hb.style.animation='none';void hb.offsetWidth;hb.style.animation='fadein .35s';
  if(p.hint>=2)$('#hintBtn').hidden=true;setBubble('הִנֵּה רֶמֶז');
}
function praise(text){const qa=$('#qa');const pr=h('div','praise',text);qa.appendChild(pr);setTimeout(()=>pr.remove(),1000);}
function recordDay(){const d=today();if(!save.days.includes(d))save.days.push(d);}
function addRq(q){const k=qkey(q);if(save.rq.some(x=>qkey(x.q)===k))return;const c=Object.assign({},q);delete c.fromRq;save.rq.push({q:c,u:play.u.id});save.rq=save.rq.slice(-60);}
function removeRq(q){const k=qkey(q);save.rq=save.rq.filter(x=>qkey(x.q)!==k);}
function questionDone(ok){
  const p=play,q=p.qs[p.i];save.ans++;if(ok&&p.tries===0&&p.hint===0)save.ok++;recordDay();
  if(p.tries>0||p.revealed)addRq(q);else if(q.fromRq)removeRq(q);
  persist();
}
function onCorrect(){
  const p=play,q=p.qs[p.i];p.lock=true;p.streak++;
  sfx.ok(p.streak);burst(...center($('#qa')),22);
  praise(p.streak>=5&&p.streak%5===0?`${p.streak} בִּרְצִיפוּת!`:pick(PRAISE));
  if(q.f&&p.tries===0&&p.hint===0&&!p.revealed)markFact(q.f[0],q.f[1],q.op===':'?2:1);
  const c=$('#cat');if(c){c.classList.remove('hop','tilt');void c.offsetWidth;c.classList.add('hop');}
  if(p.u.boss){p.hp--;const g=$('#giant');g.classList.remove('hit','laugh');void g.offsetWidth;g.classList.add('hit');sfx.hit();const hp=$('#hp').children;for(let k=0;k<hp.length;k++)hp[k].classList.toggle('gone',k>=p.hp);burst(...center(g),16,1,['#8d939a','#6b7178','#6aa84f']);}
  questionDone(true);p.revealed=false;
  p.i++;hudPlay();
  setTimeout(()=>{if(play!==p)return;if(p.i>=p.qs.length)finishUnit();else showQ();},D(q.k==='word'?1300:1100));
}
function onWrong(el){
  const p=play;p.tries++;p.errors++;p.streak=0;hudPlay();sfx.no();
  if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
  const c=$('#cat');if(c){c.classList.remove('hop','tilt');void c.offsetWidth;c.classList.add('tilt');}
  const g=$('#giant');if(g){g.classList.remove('hit','laugh');void g.offsetWidth;g.classList.add('laugh');}
}
function requeue(){const p=play,q=p.qs[p.i];if(!p.requeued.has(p.i)){p.qs.push(Object.assign({},q));p.requeued.add(p.qs.length-1);if(p.u.boss){p.hp++;$('#hp').insertAdjacentHTML('beforeend','<i></i>');}}}
function submit(){
  const p=play,q=p.qs[p.i];
  let allOk=true;
  p.boxes.forEach(b=>{if(b.done)return;if(parseInt(b.val,10)===b.ans){b.done=true;b.el.className='ans ok';b.el.textContent=b.ans;}else allOk=false;});
  if(allOk)return onCorrect();
  p.boxes.forEach(b=>{if(!b.done)b.el.className='ans bad';});
  onWrong($('#qa').querySelector('.eqcard,.wans'));
  if(p.tries>=3){
    p.lock=true;p.revealed=true;
    setTimeout(()=>{if(play!==p)return;p.boxes.forEach(b=>{if(!b.done){b.el.className='ans show';b.el.textContent=b.ans;}});
      setBubble('הַתְּשׁוּבָה: <span class="ltr">'+answersOf(q).join(', ')+'</span>. נְנַסֶּה שׁוּב בַּסּוֹף.');requeue();questionDone(false);
      if(p.hint<2){p.hint=1;showHintForce(2);}
      setTimeout(()=>{if(play!==p)return;p.revealed=false;p.i++;if(p.i>=p.qs.length)finishUnit();else showQ();},D(3200));},D(500));
    return;}
  setTimeout(()=>{if(play!==p)return;p.boxes.forEach(b=>{if(!b.done)b.val='';});p.bi=p.boxes.findIndex(b=>!b.done);renderBoxes();},D(600));
  setBubble('כִּמְעַט! נַסֵּה שׁוּב');
  if(p.hint<p.tries)showHint(false);
}
function showHintForce(level){const p=play,q=p.qs[p.i];const hb=$('#hint');hb.hidden=false;hb.innerHTML=hintHTML(q,level);p.hint=level;$('#hintBtn').hidden=true;}
function colType(d){
  const p=play,q=p.qs[p.i],st=p.col;if(st.c>=st.R.length)return;
  const cb=$('#cb'+st.c);
  if(d===st.R[st.c]){sfx.key();colAdvance(q,st,d,false);
    if(st.c>=st.R.length){renderCol(q,st);if(!st.anyWrong)p.tries=0;return onCorrect();}
    colPrep(q,st);if(!q.g)$('#hint').hidden=true;return;}
  st.ct++;st.anyWrong=true;p.tries=Math.max(p.tries,1);onWrong(cb);
  if(cb){cb.className='cb bad';cb.textContent=d;setTimeout(()=>{if(play===p&&p.col===st)renderCol(q,st);},D(500));}
  const hb=$('#hint');hb.hidden=false;hb.innerHTML=colHint(q,st);
  if(st.ct>=3){p.revealed=true;colAdvance(q,st,st.R[st.c],true);setBubble('הַסִּפְרָה הִיא '+st.typed[st.c-1]);
    setTimeout(()=>{if(play!==p)return;if(st.c>=st.R.length){renderCol(q,st);requeue();questionDone(false);p.i++;if(p.i>=p.qs.length)finishUnit();else showQ();}else colPrep(q,st);},D(900));}
  else setBubble('כִּמְעַט! תִּסְתַּכֵּל עַל הָרֶמֶז');
}
function finishUnit(){
  const p=play;p.lock=true;const u=p.u;
  if(u.train){save.trains++;persist();setTimeout(()=>{const ov=$('#ov');ov.hidden=false;
      ov.innerHTML=`<div class="card"><h2>סִיַּמְתָּ אֶת הָאִמּוּן!</h2><div class="sub">טָעֻיּוֹת שֶׁעוֹד מְחַכּוֹת: <span class="ltr">${save.rq.length}</span></div><div class="cs">${castle(revealedFor(pts()))}</div></div>`;
      const row=h('div','btnrow');const a=h('button','bigbtn plain sm',ICON.redo+'<span>עוֹד אִמּוּן</span>');a.onclick=startTraining;const m=h('button','bigbtn',ICON.homeW+'<span>לַמַּפָּה</span>');m.onclick=showMap;row.append(a,m);ov.firstChild.appendChild(row);
      sfx.win();rain();},D(300));return;}
  const miss=p.errors+p.hints;const st=miss<=1?3:miss<=4?2:1;
  const before=pts();if(st>stars(u.id)){save.s[u.id]=st;persist();}const after=pts();
  const r0=revealedFor(before),r1=revealedFor(after);
  if(u.boss){const g=$('#giant');if(g)g.classList.add('down');}
  setTimeout(()=>{const ov=$('#ov');ov.hidden=false;
    const title=u.final?'נִצַּחְתָּ אֶת הָעֲנָק הַגָּדוֹל!':u.boss?'נִצַּחְתָּ אֶת הָעֲנָק!':'כָּל הַכָּבוֹד אוֹרֶן!';
    ov.innerHTML=`<div class="card"><h2>${title}</h2>${u.boss?'':`<div class="sub">${u.name}</div>`}<div class="stars">${[0,1,2].map(k=>`<span style="animation-delay:${.3+k*.35}s">${k<st?SPR.star:SPR.starOff}</span>`).join('')}</div><div class="cs">${castle(r1,r0)}</div></div>`;
    const card=ov.firstChild;const row=h('div','btnrow');
    const again=h('button','bigbtn plain sm',ICON.redo+'<span>שׁוּב</span>');again.onclick=()=>playUnit(u);row.appendChild(again);
    const nextU=u.land.units[u.i+1];
    if(u.final){const f=h('button','bigbtn sm',ICON.trophy+'<span>הַתְּעוּדָה</span>');f.onclick=showFinal;row.appendChild(f);}
    else if(nextU){const n=h('button','bigbtn',ICON.play+'<span>הַבָּא</span>');n.onclick=()=>startUnit(nextU);row.appendChild(n);}
    else{const n=h('button','bigbtn',ICON.homeW+'<span>לַמַּפָּה</span>');n.onclick=showMap;row.appendChild(n);}
    card.appendChild(row);sfx.win();rain();for(let k=0;k<st;k++)setTimeout(()=>sfx.star(k),D(300+k*350));if(r1>r0)setTimeout(()=>sfx.build(),D(1300));
    sayNow=u.final?'וואו! ניצחת את הענק הגדול! אתה אלוף החשבון!':u.boss?'ניצחת את הענק!':st===3?'שלושה כוכבים!':'כל הכבוד אורן!';say(u.boss?sayNow:'');
    setTimeout(()=>{const b=row.lastChild;b&&b.focus();},300);},D(u.boss?900:300));
}

/* TABLE */
function showTable(){setScreen('sTable','mount',showMap);const c=masteredCount();
  $('#hudMid').innerHTML=`<div class="chip">לוּחַ הַכֶּפֶל שֶׁלִּי</div><div class="starcount"><span>${c} / 100</span></div>`;sayNow='כל משבצת נדלקת כשאתה עונה עליה נכון בלי רמז.';
  const s=$('#sTable');s.innerHTML='';const g=h('div','tgrid');g.appendChild(h('div','hd','×'));for(let b=1;b<=10;b++)g.appendChild(h('div','hd',String(b)));
  for(let a=1;a<=10;a++){g.appendChild(h('div','hd',String(a)));for(let b=1;b<=10;b++){const v=save.m[a+'x'+b]|0;const cell=h('button','tcell'+(v&1?' m':''),String(a*b)+(v&2?'<i class="dv"></i>':''));cell.style.setProperty('--c',COLORS[a-1]);cell.setAttribute('aria-label',`${a} × ${b}`);cell.onclick=()=>{sfx.pop(a);say(F[a]+' כפול '+F[b]+' שווה '+nw(a*b));};g.appendChild(cell);}}
  s.append(g,h('div','tlegend',`<span><i></i>כֶּפֶל בְּלִי רֶמֶז</span><span><i class="d"></i>חִלּוּק בְּלִי רֶמֶז</span>`));}
/* FINAL */
function showFinal(){setScreen('sFinal','final',showMap);$('#hudMid').innerHTML=`<div class="starcount">${SPR.star}<span>${totalStars()} / ${ALL.length*3}</span></div>`;
  const date=new Date().toLocaleDateString('he-IL');
  $('#sFinal').innerHTML=`<div class="final"><div class="t1">תְּעוּדָה</div><div class="nm">אוֹרֶן גֶּרְמָן</div><div class="rl">אַלּוּף הַחֶשְׁבּוֹן</div><div class="cs">${castle(revealedFor(pts()))}</div>
    <div class="statline"><span>${SPR.star}<b>${totalStars()}</b></span><span>${ICON.grid.replace('currentColor','#3a8fc4')}<b>${masteredCount()}</b>/100</span><span>${ICON.cal}<b>${save.days.length}</b> יְמֵי אִמּוּן</span></div>
    <div style="font-size:15px;color:#4a5a66">+ − × : · ${date}</div></div><div class="note">לשמירה: צלמו את המסך</div>`;
  sfx.win();rain();sayNow='אורן גרמן, אלוף החשבון! כל הכבוד!';say(sayNow);}

cloudInit();
window.__oren3={LANDS,ALL,hintHTML,hintData,uniq,colInit,colNeedBorrow,colBorrow,digs,get play(){return play;},get save(){return save;},startUnit,playUnit,showMap,setFast:v=>{window.__fast=v;},mergeIn};
})();
</script>
