<title>המסע של אורן</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
/* Layout: one-screen blocky adventure over an animated pixel-art world (canvas). HUD on top, scrollable screen area.
   Single deliberate look; every color set explicitly. Reading text uses a serif with clear nikud. */
:root{
  --ink:#23303b; --ink-soft:#4a5a66; --paper:#fffaf0;
  --birch:#f4e4c1; --grass:#6aa84f; --grass-l:#8acb68; --dirt:#8b5e3c;
  --wood:#c8925a; --wood-d:#94613a;
  --gold:#ffcf4d; --ok:#4fbf63; --ok-d:#2f8f43; --bad:#e2735f; --blue:#3a8fc4; --purple:#8e6fd1;
  --font:'Rubik','Segoe UI',Arial,sans-serif;
  --read:'Frank Ruhl Libre','David','Times New Roman',serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
[hidden]{display:none!important}
.tstep,.hintbox,.tlist,.tcard,.wcard,.prq,.dbox{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#8ccbea;color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #1f6feb;outline-offset:3px}
button:disabled{cursor:default}
svg.px{shape-rendering:crispEdges;display:block}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;background:#8ccbea}
#bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;z-index:0}
.clouds{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;display:block;background:#fff;opacity:.85;width:120px;height:24px;box-shadow:24px -24px 0 #fff,48px -24px 0 #fff,72px 0 0 #fff,96px 0 0 #fff;animation:drift 90s linear infinite}
.c1{top:10%;left:-200px}.c2{top:22%;left:-200px;animation-delay:-35s;transform:scale(.7)}.c3{top:6%;left:-200px;animation-delay:-62s;transform:scale(.5)}
@keyframes drift{to{left:110%}}
#app[data-w="cave"] .clouds,#app[data-w="final"] .clouds,#app[data-w="clock"] .clouds{display:none}
.ground{flex:0 0 28px;position:relative;z-index:1;background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(0,0,0,.12) 34px 36px),linear-gradient(180deg,var(--grass-l) 0 6px,var(--grass) 6px 14px,var(--dirt) 14px 100%)}
#app[data-w="cave"] .ground{background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(0,0,0,.2) 34px 36px),linear-gradient(#6b737a 0 8px,#4d5359 8px)}
#app[data-w="sea"] .ground{background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(0,0,0,.08) 34px 36px),linear-gradient(#f1dca0 0 8px,#d9bf7c 8px)}
#app[data-w="city"] .ground,#app[data-w="clock"] .ground{background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(0,0,0,.12) 34px 36px),linear-gradient(#b9b2a6 0 8px,#8f877b 8px)}

.hud{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;padding-left:var(--gut);padding-right:var(--gut-r);min-height:56px}
.hud-side{display:flex;gap:8px;min-width:112px;align-items:center}
.hud-side.end{justify-content:flex-end}
.hud-mid{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;min-width:0}
.ibtn{width:48px;height:48px;display:grid;place-items:center;background:var(--birch);box-shadow:inset -4px -4px 0 rgba(0,0,0,.18),inset 4px 4px 0 rgba(255,255,255,.6),0 4px 0 rgba(0,0,0,.25)}
.ibtn svg{width:26px;height:26px}
.ibtn.off{opacity:.5}
.chip{font-weight:800;font-size:19px;background:rgba(255,255,255,.9);padding:6px 12px;box-shadow:0 4px 0 rgba(0,0,0,.18);white-space:nowrap}
.gemc{display:flex;align-items:center;gap:6px;font-weight:900;font-size:21px;background:rgba(255,255,255,.92);padding:4px 12px;box-shadow:0 4px 0 rgba(0,0,0,.18);direction:ltr}
.gemc svg{width:24px}
.gemc.bump{animation:pop .35s}
.progress{display:flex;gap:4px;direction:ltr;flex-wrap:wrap;max-width:360px}
.pb{width:18px;height:18px;background:rgba(255,255,255,.45);box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}
.pb.on{background:var(--grass);box-shadow:inset 0 5px 0 var(--grass-l),inset -3px -3px 0 rgba(0,0,0,.2)}
.pb.cur{background:#fff;box-shadow:inset 0 0 0 3px var(--gold)}
.streak{display:flex;align-items:center;gap:4px;font-weight:900;font-size:21px;background:rgba(255,255,255,.9);padding:2px 10px;box-shadow:0 4px 0 rgba(0,0,0,.18);direction:ltr}
.streak svg{width:20px}
.starcount{display:flex;align-items:center;gap:8px;font-weight:900;font-size:21px;direction:ltr;background:rgba(255,255,255,.9);padding:4px 12px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.starcount svg{width:24px}

.screens{flex:1;position:relative;z-index:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen{flex:1 0 auto;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:8px;padding-left:var(--gut);padding-right:var(--gut-r)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{40%{transform:scale(1.2)}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.shake{animation:shake .45s}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

/* block wipe transition */
.wipe{position:absolute;inset:0;z-index:8;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(7,1fr);pointer-events:none}
.wipe i{background:#3f8a33;box-shadow:inset -6px -6px 0 rgba(0,0,0,.2),inset 6px 6px 0 rgba(255,255,255,.15);animation:wipeout .42s ease-in forwards}
.wipe i:nth-child(odd){background:#6aa84f}
@keyframes wipeout{to{transform:scale(0) rotate(45deg);opacity:.4}}

.bigbtn{display:inline-flex;align-items:center;gap:12px;font-weight:900;font-size:26px;color:#fff;padding:12px 30px;background:var(--ok);box-shadow:inset -6px -6px 0 var(--ok-d),inset 6px 6px 0 rgba(255,255,255,.35),0 7px 0 rgba(0,0,0,.3)}
.bigbtn svg{width:30px;height:30px}
.bigbtn.blue{background:var(--blue);box-shadow:inset -6px -6px 0 #23698f,inset 6px 6px 0 rgba(255,255,255,.3),0 7px 0 rgba(0,0,0,.3)}
.bigbtn.gold{background:var(--gold);color:var(--ink);box-shadow:inset -6px -6px 0 #c99a1c,inset 6px 6px 0 rgba(255,255,255,.4),0 7px 0 rgba(0,0,0,.3)}
.bigbtn.purple{background:var(--purple);box-shadow:inset -6px -6px 0 #5b3f8c,inset 6px 6px 0 rgba(255,255,255,.3),0 7px 0 rgba(0,0,0,.3)}
.bigbtn.plain{background:var(--birch);color:var(--ink);box-shadow:inset -6px -6px 0 rgba(0,0,0,.15),inset 6px 6px 0 rgba(255,255,255,.6),0 7px 0 rgba(0,0,0,.25)}
.bigbtn.sm{font-size:19px;padding:9px 18px}.bigbtn.sm svg{width:22px;height:22px}
.btnrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
@media (hover:hover){.ibtn:hover,.bigbtn:hover,.key:hover,.wcard2:hover,.pnode:not(:disabled):hover,.tcell:hover,.hintbtn:hover,.chb:hover,.tool:hover,.kcell:hover,.opt:hover{filter:brightness(1.08) saturate(1.1)}}
.ibtn:active,.bigbtn:active,.key:active,.chb:active{transform:translateY(3px)}

.title{font-weight:900;font-size:clamp(42px,7vw,88px);margin:0;color:#fff;text-align:center;line-height:1.1;text-shadow:5px 5px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.scene{display:flex;align-items:flex-end;gap:22px;justify-content:center;flex-wrap:wrap}
.scene .s-av svg{width:84px}.scene .s-pet svg{width:76px}.scene .s-mix svg{width:120px}.scene .s-castle svg{width:260px}
.note{font-size:16px;color:var(--ink-soft);background:rgba(255,255,255,.8);padding:6px 12px}

/* MAP */
.topbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:96px;padding:8px 10px;background:rgba(255,255,255,.9);box-shadow:inset -4px -4px 0 rgba(0,0,0,.12),0 5px 0 rgba(0,0,0,.22);font-weight:800;font-size:15px}
.tool .ti{height:40px;display:grid;place-items:center}.tool .ti svg{height:38px;width:auto}
.tool.dim{opacity:.6}
.worlds{display:grid;grid-template-columns:repeat(4,minmax(140px,180px));gap:14px}
.wcard2{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:24px 8px 10px;min-height:170px;background:var(--birch);box-shadow:inset -6px -6px 0 rgba(0,0,0,.14),inset 6px 6px 0 rgba(255,255,255,.55),0 6px 0 rgba(0,0,0,.25)}
.wcard2::before{content:"";position:absolute;inset:0 0 auto;height:14px;background:var(--lc);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.wcard2 .ico{height:56px;display:flex;align-items:flex-end;gap:4px}.wcard2 .ico svg{height:52px;width:auto}
.wcard2 .gd{position:absolute;top:18px;inset-inline-end:6px;width:34px}
.wcard2 .gd.caged{filter:grayscale(.7) brightness(.8)}
.wcard2 .gd.caged::after{content:"";position:absolute;inset:-3px;background:repeating-linear-gradient(90deg,#3a3f45 0 3px,transparent 3px 8px)}
.wcard2 .nm{font-weight:800;font-size:18px;text-align:center}
.wcard2 .op{position:absolute;top:20px;inset-inline-start:6px;font-weight:900;font-size:17px;min-width:30px;height:30px;padding:0 4px;display:grid;place-items:center;background:var(--lc);color:#fff}
.wcard2 .bar{width:100%;height:10px;background:rgba(0,0,0,.1)}
.wcard2 .bar i{display:block;height:100%;background:var(--gold)}
.wcard2 .cnt{font-size:14px;font-weight:700;color:var(--ink-soft);direction:ltr;display:flex;gap:4px;align-items:center}
.wcard2 .cnt svg{width:15px}
.wcard2.locked{filter:grayscale(.85);opacity:.75}
.wcard2 .lk{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:30px}
.hello{display:flex;align-items:flex-end;gap:10px}
.hello .av svg{width:54px}.hello .pet svg{width:48px}
.hello .bub{font-family:var(--read);font-size:22px;background:#fff;padding:8px 14px;box-shadow:0 4px 0 rgba(0,0,0,.18);max-width:420px}
.statline{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:15px;color:var(--ink-soft);background:rgba(255,255,255,.75);padding:5px 12px}
.statline span{display:flex;align-items:center;gap:5px}
.statline svg{width:17px}
.reset{font-size:12px;color:var(--ink-soft);opacity:.6;padding:5px 8px;background:rgba(255,255,255,.4)}
.reset.hold{opacity:1;background:var(--bad);color:#fff}

/* WORLD PATH */
.whead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.whead h1{margin:0;font-size:36px;font-weight:900;color:#fff;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.whead .gd svg{width:58px}
.wpath{position:relative;width:min(720px,100%);margin-bottom:20px}
.wpath svg.ln{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pnode{position:absolute;transform:translate(-50%,-50%);width:66px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--paper);
  box-shadow:inset -5px -5px 0 rgba(0,0,0,.14),inset 5px 5px 0 #fff,0 6px 0 rgba(0,0,0,.3)}
.pnode .ic svg{width:30px;height:30px}
.pnode .st{position:absolute;bottom:-14px;display:flex;gap:1px;direction:ltr}.pnode .st svg{width:15px}
.pnode.t-learn{background:#e4f1fb}.pnode.t-game{background:#fff0d9}.pnode.t-chal{background:#efe7ff}
.pnode.boss{width:96px;height:96px;background:#ffe3e3}.pnode.boss .ic svg{width:60px;height:auto}
.pnode:disabled{filter:grayscale(1);opacity:.45}
.pnode.cur{box-shadow:0 0 0 5px var(--gold),0 0 24px var(--gold),0 6px 0 rgba(0,0,0,.3);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px var(--gold),0 0 6px var(--gold),0 6px 0 rgba(0,0,0,.3)}}
.ulabel{position:absolute;transform:translate(-50%,0);font-weight:800;font-size:15px;background:rgba(255,255,255,.92);padding:3px 10px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.15);display:flex;gap:8px;align-items:center}
.ulabel .ex{direction:ltr;color:var(--blue);font-weight:900}
.pav{position:absolute;transform:translate(-50%,-100%);transition:left .9s ease-in-out,top .9s ease-in-out;z-index:2;pointer-events:none;display:flex;align-items:flex-end}
.pav .a svg{width:34px}.pav .p svg{width:28px}
.pav.walk .a{animation:walk .25s steps(2) infinite}
@keyframes walk{50%{transform:translateY(-4px)}}
.guard{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.guard svg{width:54px}
.guard.caged::after{content:"";position:absolute;inset:-6px;background:repeating-linear-gradient(90deg,#3a3f45 0 4px,transparent 4px 11px);box-shadow:inset 0 4px 0 #3a3f45,inset 0 -4px 0 #3a3f45}
.guard.free{animation:bob 1.6s ease-in-out infinite}

/* STORY dialog */
.dlg{position:absolute;inset:0;z-index:7;display:flex;align-items:flex-end;justify-content:center;padding:20px var(--gut-r) 50px var(--gut);background:rgba(20,25,40,.45);animation:fadein .3s}
.dbox{position:relative;display:flex;align-items:flex-end;gap:18px;width:min(900px,100%);background:var(--paper);padding:18px 22px;box-shadow:0 0 0 6px var(--ink),0 12px 0 6px rgba(0,0,0,.25)}
.dbox .who{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.dbox .who .sp svg{width:110px}
.dbox .who .sp{animation:talkb .5s ease-in-out infinite alternate}
@keyframes talkb{to{transform:translateY(-4px)}}
.dbox .who b{font-size:17px;background:var(--ink);color:#fff;padding:2px 10px}
.dbox .txt{flex:1;font-family:var(--read);font-size:30px;line-height:1.65;min-height:110px}
.dbox .ctl{position:absolute;bottom:-26px;inset-inline-end:20px;display:flex;gap:8px}

/* PLAY */
.play{width:min(1140px,100%);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center}
.play.nopad{grid-template-columns:1fr}
.left{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.talk{display:flex;align-items:center;gap:12px;min-height:56px}
.pet svg{width:54px}
.pet.hop{animation:hop .6s}.pet.tilt{animation:tilt .6s}
@keyframes hop{30%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
@keyframes tilt{30%{transform:rotate(-10deg)}70%{transform:rotate(8deg)}}
.bubble{position:relative;display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;background:#fff;padding:8px 16px;box-shadow:0 5px 0 rgba(0,0,0,.18);min-height:46px}
.bubble::before{content:"";position:absolute;inset-inline-start:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-inline-end:14px solid #fff;border-inline-start:0}
.bubble svg{width:22px;height:22px;flex:none;color:var(--blue)}
.badge{font-weight:900;font-size:15px;color:#fff;background:var(--purple);padding:3px 10px}
.bossrow{display:flex;align-items:center;gap:18px}
.giant svg{width:100px}
.giant.hit{animation:hit .5s}.giant.laugh{animation:laugh .6s}.giant.down{animation:down 1s forwards}
@keyframes hit{20%{transform:translateX(10px) rotate(6deg);filter:brightness(1.8)}50%{transform:translateX(-6px)}}
@keyframes laugh{25%{transform:translateY(-10px) scaleY(1.05)}50%{transform:translateY(0)}75%{transform:translateY(-6px)}}
@keyframes down{to{transform:translateY(40px) rotate(-20deg);opacity:0}}
.hp{display:flex;gap:3px;direction:ltr;flex-wrap:wrap;max-width:260px}
.hp i{width:15px;height:19px;background:#e4572e;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.3)}
.hp i.gone{background:rgba(0,0,0,.15);box-shadow:none}
/* mode scenes */
.scn{position:relative;width:min(640px,100%);height:96px;background:rgba(255,255,255,.35);box-shadow:inset 0 -8px 0 rgba(0,0,0,.08)}
.scn.mine{display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:0 10px 8px;direction:rtl}
.mb{position:relative;width:46px;height:46px;background:#8a9097;box-shadow:inset -5px -5px 0 rgba(0,0,0,.25),inset 5px 5px 0 rgba(255,255,255,.2)}
.mb::after{content:"";position:absolute;left:10px;top:12px;width:8px;height:6px;background:#3cc8bb;box-shadow:16px 10px 0 #3cc8bb}
.mb.br{animation:breakb .45s forwards}
@keyframes breakb{30%{transform:scale(1.15) rotate(6deg);filter:brightness(1.6)}100%{transform:scale(0) rotate(30deg);opacity:0}}
.chest svg{width:64px}
.chest.open{animation:pop .5s}
.scn.run{overflow:hidden;background:linear-gradient(transparent 70%,#8acb68 70%,#6aa84f 78%,#8b5e3c 78%)}
.runner{position:absolute;bottom:28%;transform:translateX(50%);transition:right .6s cubic-bezier(.3,1.4,.6,1)}
.runner.jump .a{animation:jumpr .6s}
@keyframes jumpr{40%{transform:translateY(-34px)}}
.runner .a svg{width:34px}
.obst{position:absolute;bottom:28%;width:16px;height:16px;background:#c0392b;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25);transform:translateX(50%)}
.obst.done{background:#9aa1a8;opacity:.5}
.fflag{position:absolute;bottom:28%;left:10px;width:6px;height:52px;background:#5a5f66}
.fflag::after{content:"";position:absolute;top:0;left:6px;width:26px;height:18px;background:repeating-conic-gradient(#222 0 25%,#fff 0 50%) 0 0/10px 10px}
.scn.build{background:linear-gradient(transparent 55%,#3a8fc4 55%,#2f7aa8 100%);display:flex;align-items:flex-start;justify-content:center;padding-top:40px;direction:rtl}
.plank{width:40px;height:16px;margin:0 1px;background:transparent;outline:2px dashed rgba(255,255,255,.6)}
.plank.on{background:#c8925a;outline:none;box-shadow:inset 0 -4px 0 var(--wood-d);animation:dropp .4s}
@keyframes dropp{from{transform:translateY(-40px);opacity:0}}
.bank{width:40px;height:56px;background:#6aa84f;box-shadow:inset 0 8px 0 #8acb68}
.walker{position:absolute;top:2px;right:6px;transition:right 1.6s linear}
.walker svg{width:30px}
/* question */
.qarea{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.eqcard{display:flex;align-items:center;gap:14px;direction:ltr;font-weight:900;font-size:62px;font-variant-numeric:tabular-nums;background:var(--paper);padding:12px 26px;box-shadow:inset -6px -6px 0 rgba(0,0,0,.1),inset 6px 6px 0 #fff,0 8px 0 rgba(0,0,0,.28);flex-wrap:wrap;justify-content:center;max-width:100%}
.eqcard .op{color:var(--blue)}
.eqcard .wd{font-size:.42em;font-weight:800;color:var(--ink-soft);direction:rtl;font-family:var(--read)}
.eqcard .slot{width:1.4em;height:1.2em;display:grid;place-items:center;border:5px dashed #b9c4cc;color:#b9c4cc;font-size:.8em}
.ans{min-width:1.5em;padding:0 10px;text-align:center;background:#fff3c4;box-shadow:inset 0 -6px 0 var(--gold);color:var(--ink);cursor:pointer}
.ans.empty{color:rgba(0,0,0,.25)}
.ans.foc{outline:4px solid var(--blue);outline-offset:2px}
.ans.ok{background:var(--ok);color:#fff;box-shadow:none}
.ans.bad{background:var(--bad);color:#fff;box-shadow:none}
.ans.show{background:var(--blue);color:#fff;box-shadow:none}
.praise{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:27px;font-weight:900;color:var(--ok-d);background:#fff;padding:2px 16px;white-space:nowrap;direction:rtl;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:praise 1s forwards;pointer-events:none;z-index:2}
@keyframes praise{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}25%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.pre{display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,.7);padding:10px 14px}
.pre .cap2{font-weight:900;font-size:24px;direction:ltr}
.prq{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--paper);padding:14px 22px;box-shadow:inset -6px -6px 0 rgba(0,0,0,.08),inset 6px 6px 0 #fff,0 8px 0 rgba(0,0,0,.25)}
.prq .qq{font-family:var(--read);font-size:30px;font-weight:700}
.prq .big{font-weight:900;font-size:72px;direction:ltr;line-height:1}
.prq svg.clock{width:190px;height:190px}
.prq svg.frac{width:170px;height:170px}
.chs{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.chs.ltr{direction:ltr}
.chb{min-width:96px;height:78px;padding:0 18px;display:grid;place-items:center;font-weight:900;font-size:32px;background:var(--birch);box-shadow:inset -5px -5px 0 rgba(0,0,0,.16),inset 5px 5px 0 rgba(255,255,255,.6),0 6px 0 rgba(0,0,0,.28)}
.chb.tx{font-family:var(--read);font-size:30px}
.chb.sym{font-size:46px;min-width:90px}
.chb.ok{background:var(--ok);color:#fff}
.chb.bad{background:var(--bad);color:#fff;opacity:.6}
.chb.show{background:var(--blue);color:#fff}
.bubs{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;direction:ltr;padding:6px}
.bubb{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:32px;color:var(--ink);
  background:radial-gradient(circle at 32% 30%,#fff 0 12%,rgba(255,255,255,.55) 13%,rgba(140,203,234,.55) 60%,rgba(58,143,196,.7));box-shadow:inset 0 0 0 3px rgba(255,255,255,.8),0 6px 14px rgba(0,0,0,.18);animation:floatb 3s ease-in-out infinite}
.bubb:nth-child(2){animation-delay:-.8s}.bubb:nth-child(3){animation-delay:-1.6s}.bubb:nth-child(4){animation-delay:-2.3s}
@keyframes floatb{50%{transform:translateY(-12px)}}
.bubb.pop{animation:popb .35s forwards}
@keyframes popb{60%{transform:scale(1.3);opacity:.6}100%{transform:scale(0);opacity:0}}
.bubb.bad{background:radial-gradient(circle,#fff 0 20%,#f3b3a7);opacity:.5}
.wcard{max-width:760px;background:var(--paper);padding:16px 24px;box-shadow:inset -6px -6px 0 rgba(0,0,0,.08),inset 6px 6px 0 #fff,0 8px 0 rgba(0,0,0,.25);font-family:var(--read);font-size:30px;line-height:1.75;font-weight:500}
.wcard b{font-family:var(--font);font-weight:900;color:var(--blue);direction:ltr;unicode-bidi:isolate;padding:0 2px}
.wans{display:flex;align-items:center;gap:12px;font-weight:800;font-size:27px;font-family:var(--read)}
.wans .ans{font-family:var(--font);font-size:42px;font-weight:900;min-width:2.2em}
.colwrap{display:grid;direction:ltr;gap:4px;background:var(--paper);padding:14px 22px 16px;box-shadow:inset -6px -6px 0 rgba(0,0,0,.08),inset 6px 6px 0 #fff,0 8px 0 rgba(0,0,0,.25);--cw:60px;
  background-image:linear-gradient(rgba(58,143,196,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(58,143,196,.12) 1px,transparent 1px);background-size:var(--cw) var(--cw)}
.cc{width:var(--cw);height:var(--cw);display:grid;place-items:center;font-weight:900;font-size:44px;font-variant-numeric:tabular-nums;position:relative}
.cc.mk{height:32px;font-size:21px;color:#d0452f;align-self:end}
.cc.cr{color:var(--ok-d)}
.cc.x::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:4px;background:#d0452f;transform:rotate(-30deg)}
.cc.x{color:#9aa}
.cc.op{color:var(--blue)}
.cline{grid-column:1/-1;height:5px;background:var(--ink)}
.cb{width:calc(var(--cw) - 6px);height:calc(var(--cw) - 6px);margin:3px;display:grid;place-items:center;font-weight:900;font-size:42px;background:#fff3c4;box-shadow:inset 0 -5px 0 var(--gold)}
.cb.cur{outline:4px solid var(--blue);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{outline-color:transparent}}
.cb.ok{background:#d9f2dd;box-shadow:inset 0 -5px 0 var(--ok)}
.cb.show{background:#d5e8f5;box-shadow:inset 0 -5px 0 var(--blue)}
.cb.bad{background:var(--bad);color:#fff}
.cempty{width:var(--cw)}
.hintrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hintbox{width:100%;max-width:740px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;background:rgba(255,255,255,.82);box-shadow:0 5px 0 rgba(0,0,0,.12);animation:fadein .35s}
.cap{font-weight:800;font-size:22px;text-align:center;line-height:1.5;display:flex;flex-direction:column;align-items:center;gap:8px}
.hintbtn{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:18px;padding:8px 14px;background:#fff3c4;box-shadow:inset -4px -4px 0 rgba(0,0,0,.12),0 4px 0 rgba(0,0,0,.2)}
.hintbtn svg{width:22px;height:22px}
.hintbtn.lsn{background:#e5f1fb}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:10px;direction:ltr}
.key{height:68px;display:grid;place-items:center;font-weight:900;font-size:33px;background:var(--birch);box-shadow:inset -5px -5px 0 rgba(0,0,0,.16),inset 5px 5px 0 rgba(255,255,255,.6),0 6px 0 rgba(0,0,0,.28)}
.key.go{background:var(--ok);color:#fff;box-shadow:inset -5px -5px 0 var(--ok-d),inset 5px 5px 0 rgba(255,255,255,.3),0 6px 0 rgba(0,0,0,.28)}
.key svg{width:30px;height:30px}
.key.press{transform:translateY(3px);filter:brightness(.92)}
.timer{flex:1 1 320px;width:min(520px,100%);height:18px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#e4572e,#ffcf4d);transition:width .25s linear}
.score{font-weight:900;font-size:30px;background:#fff;padding:4px 16px;box-shadow:0 4px 0 rgba(0,0,0,.2);direction:ltr}
/* hint visuals */
.tf{display:flex;gap:14px;direction:ltr;flex-wrap:wrap;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,26px);gap:4px;padding:6px;background:#fff;box-shadow:inset 0 0 0 3px #c9b98f}
.frame i{width:26px;height:26px;position:relative;background:#f1ece0}
.frame i.a{background:#e8873a;box-shadow:inset -3px -3px 0 rgba(0,0,0,.2)}
.frame i.b{background:#3a8fc4;box-shadow:inset -3px -3px 0 rgba(0,0,0,.2)}
.frame i.c{background:#7cc35f;box-shadow:inset -3px -3px 0 rgba(0,0,0,.2)}
.frame i.x{background:#e8873a;opacity:.35}
.frame i.x::after{content:"";position:absolute;left:-2px;right:-2px;top:11px;height:4px;background:#b23a2a;transform:rotate(-45deg)}
.frame i.e{background:#fff;box-shadow:inset 0 0 0 3px #3a8fc4}
.bt{display:flex;gap:24px;direction:ltr;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.btn10{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap;max-width:420px}
.flat{display:grid;grid-template-columns:repeat(10,5px);gap:1px;padding:1px;background:rgba(0,0,0,.18)}
.flat i{width:5px;height:5px;background:var(--c)}
.rod{display:flex;flex-direction:column;gap:1px;padding:1px;background:rgba(0,0,0,.15)}
.rod i{display:block;width:12px;height:5px;background:var(--c)}
.one{display:block;width:12px;height:12px;background:var(--c);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.ones{display:grid;grid-template-columns:repeat(2,12px);gap:2px;align-content:end}
.btlbl{font-weight:900;font-size:22px;text-align:center;margin-top:4px}
.btwrap{display:flex;flex-direction:column;align-items:center}
.steps{display:flex;flex-direction:column;gap:4px;direction:ltr;font-weight:900;font-size:27px;font-variant-numeric:tabular-nums;align-items:center}
.steps div{background:#fff;padding:2px 14px;box-shadow:0 3px 0 rgba(0,0,0,.12);animation:fadein .4s backwards}
.steps div:nth-child(2){animation-delay:.35s}.steps div:nth-child(3){animation-delay:.7s}.steps div:nth-child(4){animation-delay:1.05s}
.steps b{color:var(--blue)}
.skip{display:flex;gap:4px;direction:ltr;flex-wrap:wrap;justify-content:center;max-width:680px}
.skip b{min-width:42px;height:38px;padding:0 4px;display:grid;place-items:center;font-size:20px;font-weight:900;background:#fff;box-shadow:inset 0 -4px 0 var(--gold);position:relative}
.skip b.q{background:var(--gold);box-shadow:none}
.skip b small{position:absolute;top:-12px;right:-4px;font-size:12px;background:var(--blue);color:#fff;padding:0 4px;line-height:16px}
.arr{display:flex;flex-direction:column;gap:3px;direction:ltr}
.arr .r{display:flex;gap:3px;align-items:center}
.arr .r i{width:var(--s,18px);height:var(--s,18px);background:var(--c);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.arr .r small{width:22px;font-size:13px;font-weight:800;color:var(--ink-soft);text-align:center}
.share{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;direction:ltr}
.box{min-width:60px;min-height:52px;padding:8px 6px 6px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-end;background:#c8925a;box-shadow:inset 0 -5px 0 var(--wood-d),inset 0 5px 0 rgba(255,255,255,.2);max-width:104px}
.box svg{width:16px}
.pile{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:440px;min-height:30px}
.pile svg{width:22px}
.pairs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;direction:ltr;max-width:520px}
.pairs span{display:flex;gap:3px;padding:4px;background:#fff;box-shadow:inset 0 0 0 2px #c9b98f}
.pairs span.lone{box-shadow:inset 0 0 0 3px var(--bad)}
.pairs i{width:16px;height:16px;border-radius:50%;background:#3a8fc4}
.ptab{display:grid;grid-template-columns:auto repeat(3,56px);gap:3px;direction:ltr;font-weight:900;font-size:24px;text-align:center}
.ptab .hd{font-size:13px;font-family:var(--read);background:var(--ink);color:#fff;padding:3px 0}
.ptab span{background:#fff;padding:2px 0}

/* LESSON */
.learn{width:min(1100px,100%);display:flex;flex-direction:column;align-items:center;gap:14px}
.learn h1{margin:0;font-size:34px;font-weight:900;color:#fff;text-align:center;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.lsent{font-family:var(--read);font-size:29px;line-height:1.7;background:rgba(255,255,255,.92);padding:10px 22px;max-width:820px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.lsent b{font-family:var(--font);font-weight:900;color:var(--blue);direction:ltr;unicode-bidi:isolate}
.lgrid{display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap}
.lpanel{background:rgba(255,255,255,.8);padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.14);display:grid;place-items:center}
.facts{display:grid;grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:4px 22px;direction:ltr;font-weight:900;font-size:23px;font-variant-numeric:tabular-nums}
.facts div{opacity:.25;transition:opacity .3s}.facts div.on{opacity:1}.facts div.cur{color:var(--ok-d)}
.dealrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;direction:ltr}
.dealbox{width:96px;min-height:76px;padding:10px 6px 6px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-end;background:#c8925a;box-shadow:inset 0 -6px 0 var(--wood-d),inset 0 6px 0 rgba(255,255,255,.2)}
.dealbox svg{width:22px;animation:dropp .35s}
.bigeq{font-weight:900;font-size:50px;direction:ltr;background:var(--paper);padding:6px 26px;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:pop .5s}
.lcap{font-weight:800;font-size:21px;background:rgba(255,255,255,.9);padding:6px 16px;text-align:center}
.exstage{display:flex;flex-direction:column;align-items:center;gap:12px;min-height:120px}

/* KINGDOM */
.kwrap{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:min(1160px,100%)}
.kscene{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.35);padding:10px}
.ktop{display:flex;align-items:flex-end;gap:6px}
.ktop .cs svg{width:300px;max-width:60vw}
.ktop .fr{display:flex;gap:2px;align-items:flex-end}.ktop .fr svg{width:34px}
.kgrid{display:grid;grid-template-columns:repeat(12,44px);grid-template-rows:repeat(4,44px);background:repeating-linear-gradient(90deg,#7cc35f 0 44px,#74b957 44px 88px);direction:ltr}
.kcell{width:44px;height:44px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.kcell svg{max-width:38px;max-height:38px;width:auto;height:auto}
.kcell.new svg{animation:pop .4s}
.shop{display:grid;grid-template-columns:repeat(3,88px);gap:8px;background:rgba(255,255,255,.85);padding:10px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.shop h3{grid-column:1/-1;margin:0;font-size:20px;text-align:center}
.opt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;background:var(--paper);box-shadow:inset -3px -3px 0 rgba(0,0,0,.12),0 3px 0 rgba(0,0,0,.18);font-weight:800;font-size:14px}
.opt .si{height:36px;display:grid;place-items:center}.opt .si svg{max-height:34px;max-width:44px;width:auto;height:auto}
.opt .pr{direction:ltr;display:flex;gap:3px;align-items:center;font-size:14px}.opt .pr svg{width:13px}
.opt.sel{box-shadow:0 0 0 4px var(--gold),0 3px 0 rgba(0,0,0,.18)}
.opt.poor{opacity:.45}
/* AVATAR STUDIO */
.studio{display:flex;gap:26px;align-items:center;justify-content:center;flex-wrap:wrap}
.studio .pv{display:flex;align-items:flex-end;gap:8px;background:rgba(255,255,255,.6);padding:18px}
.studio .pv .a svg{width:120px}.studio .pv .p svg{width:90px}
.orows{display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,.88);padding:14px 16px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.orow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.orow h4{margin:0;width:96px;font-family:var(--read);font-size:21px}
.sw{width:42px;height:42px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.2),0 3px 0 rgba(0,0,0,.2)}
.sw.sel,.hatb.sel{outline:4px solid var(--ink);outline-offset:2px}
.hatb{position:relative;width:58px;height:54px;display:grid;place-items:center;background:var(--paper);box-shadow:inset -3px -3px 0 rgba(0,0,0,.12),0 3px 0 rgba(0,0,0,.2)}
.hatb svg{width:40px}
.hatb .pr{position:absolute;bottom:-10px;font-size:12px;font-weight:900;background:var(--ink);color:#fff;padding:0 5px;direction:ltr;display:flex;gap:2px;align-items:center}
.hatb .pr svg{width:10px}
/* TEACHER */
.tch{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(900px,100%)}
.tabs{display:flex;gap:8px}
.tabs button{font-weight:800;font-size:19px;padding:8px 16px;background:rgba(255,255,255,.6)}
.tabs button.on{background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.tstep{display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(255,255,255,.88);padding:12px 18px;box-shadow:0 5px 0 rgba(0,0,0,.14);width:100%}
.tstep h3{margin:0;font-family:var(--read);font-size:24px}
.optrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.optrow button{font-family:var(--read);font-weight:700;font-size:22px;padding:6px 14px;background:var(--paper);box-shadow:inset -3px -3px 0 rgba(0,0,0,.12),0 3px 0 rgba(0,0,0,.18)}
.optrow button.big{font-family:var(--font);font-size:36px;font-weight:900;min-width:70px}
.optrow button.sel{background:var(--gold)}
.tlist{display:flex;flex-direction:column;gap:10px;width:100%}
.tcard{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--paper);padding:10px 14px;box-shadow:0 4px 0 rgba(0,0,0,.15);text-align:start}
.tcard .q{font-family:var(--read);font-size:21px}
.tcard .q b{font-family:var(--font);color:var(--blue)}
.tcard .s{font-weight:900;font-size:15px;padding:3px 8px;background:#e5f1fb;white-space:nowrap}
.tcard .s.ok{background:#d9f2dd}
/* TABLE */
.tgrid{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;width:min(600px,100%);direction:ltr}
.tgrid .hd{display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;background:var(--ink);aspect-ratio:1}
.tcell{position:relative;display:grid;place-items:center;aspect-ratio:1;font-weight:800;font-size:clamp(12px,2.2vw,18px);background:rgba(255,255,255,.6);color:rgba(0,0,0,.35)}
.tcell.m{color:#fff;background:var(--c);box-shadow:inset -3px -3px 0 rgba(0,0,0,.2),inset 3px 3px 0 rgba(255,255,255,.3),0 0 10px var(--c)}
.tcell .dv{position:absolute;top:2px;right:2px;width:9px;height:9px;background:#3cc8bb;transform:rotate(45deg);box-shadow:0 0 0 1px #fff}
.tlegend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:16px;background:rgba(255,255,255,.8);padding:6px 14px}
.tlegend span{display:flex;align-items:center;gap:6px}
.tlegend i{display:inline-block;width:16px;height:16px;background:#e4572e}
.tlegend i.d{width:10px;height:10px;background:#3cc8bb;transform:rotate(45deg)}

.overlay{position:absolute;inset:0;z-index:5;display:flex;overflow-y:auto;padding:22px 16px;background:rgba(20,30,40,.6);animation:fadein .35s}
.overlay>*{margin:auto}
.card{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--paper);padding:20px 34px;max-width:100%;box-shadow:0 0 0 8px var(--grass),0 0 0 14px var(--dirt),0 16px 0 14px rgba(0,0,0,.25)}
.card h2{margin:0;font-size:36px;font-weight:900;text-align:center}
.card .sub{font-weight:800;font-size:19px;color:var(--ink-soft);text-align:center}
.card .stars{display:flex;gap:10px;direction:ltr}
.card .stars span svg{width:70px}
.card .stars span{animation:spin .7s cubic-bezier(.2,.9,.3,1.3) backwards}
@keyframes spin{from{transform:scale(0) rotate(-180deg)}}
.card .gain{display:flex;align-items:center;gap:8px;font-weight:900;font-size:30px;direction:ltr;color:#1f8f86}
.card .gain svg{width:30px}
.card .cs svg{width:260px;max-width:100%}
.castle .gh{opacity:.15}
.castle .nw{animation:dropp .5s backwards}
.gemfly{position:absolute;z-index:9;width:26px;pointer-events:none;transition:transform .75s cubic-bezier(.5,-.3,.6,1),opacity .75s}
.final{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;padding:22px 44px 16px;text-align:center;max-width:calc(100% - 40px);box-shadow:0 0 0 10px #8e6fd1,0 0 0 18px #5b3f8c,0 18px 0 18px rgba(0,0,0,.2)}
.final .t1{font-weight:900;font-size:24px;letter-spacing:4px;color:#8e6fd1}
.final .nm{font-weight:900;font-size:clamp(44px,7vw,76px);line-height:1.05}
.final .rl{font-weight:800;font-size:28px;color:var(--blue)}
.final .cs svg{width:280px;max-width:100%}
.final .fr{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap;justify-content:center;max-width:100%}.final .fr svg{width:36px}
@media (max-width:500px){.final .fr svg{width:26px}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6}


/* polish: pixel outlines, effects */
.bigbtn,.key,.chb,.ibtn,.tool,.wcard2,.opt,.hatb,.hintbtn,.gemc,.chip,.starcount,.streak{outline:3px solid rgba(29,38,49,.88);outline-offset:0}
.bigbtn:focus-visible,.key:focus-visible,.chb:focus-visible,.ibtn:focus-visible{outline:4px solid #1f6feb}
.eqcard,.wcard,.prq,.colwrap,.card,.dbox{outline:4px solid #1d2631}
.pnode{outline:3px solid #1d2631}
.flash{animation:flash .65s ease-out}
@keyframes flash{25%{box-shadow:0 0 0 6px #ffcf4d,0 0 34px 8px #ffcf4d,0 8px 0 rgba(0,0,0,.28);transform:scale(1.04)}}
.quake{animation:quake .35s}
@keyframes quake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.ftxt{position:absolute;z-index:9;transform:translate(-50%,0);font-weight:900;font-size:34px;color:#7ff0e4;direction:ltr;pointer-events:none;
  text-shadow:3px 3px 0 #1d2631,-2px -2px 0 #1d2631,2px -2px 0 #1d2631,-2px 2px 0 #1d2631;animation:ftxt 1.2s ease-out forwards}

/* ---------- castle ---------- */
const CASTLE=(()=>{const m=new Map();const set=(x,y,c)=>m.set(x+','+y,c);const stone=(x,y)=>((x+y)%2?'#a7adb4':'#979ea5');
  for(const x0 of [0,22]){for(let y=6;y<=18;y++)for(let x=x0;x<x0+6;x++)set(x,y,stone(x,y));for(const dx of [0,2,3,5])set(x0+dx,5,'#8a9097');}
  for(let y=11;y<=18;y++)for(let x=6;x<=21;x++)set(x,y,stone(x,y));
  for(let x=7;x<=21;x+=2)set(x,10,'#8a9097');
  for(let y=4;y<=10;y++)for(let x=10;x<=17;x++)set(x,y,stone(x,y));
  for(const x of [10,12,15,17])set(x,3,'#8a9097');
  for(let y=15;y<=18;y++)for(let x=12;x<=15;x++)set(x,y,'#6b4423');set(13,14,'#6b4423');set(14,14,'#6b4423');
  for(const [x,y] of [[2,9],[3,9],[2,10],[3,10],[24,9],[25,9],[24,10],[25,10],[13,6],[14,6],[13,7],[14,7],[2,14],[3,14],[24,14],[25,14],[8,13],[19,13]])set(x,y,'#ffd166');
  for(let y=1;y<=4;y++){set(1,y,'#5a5f66');set(26,y,'#5a5f66');}
  set(2,1,'#e4572e');set(3,1,'#e4572e');set(2,2,'#e4572e');set(25,1,'#3a8fc4');set(24,1,'#3a8fc4');set(25,2,'#3a8fc4');
  for(let y=0;y<=2;y++)set(14,y,'#5a5f66');set(15,0,'#ffcf4d');set(16,0,'#ffcf4d');set(15,1,'#ffcf4d');
  return [...m.entries()].map(([k,c])=>{const [x,y]=k.split(',').map(Number);return {x,y,c};}).sort((a,b)=>b.y-a.y||a.x-b.x);})();
function castle(revealed,newFrom=revealed){const U=10;let s=`<svg class="px castle" viewBox="0 0 280 200" aria-hidden="true">`;
  for(let x=0;x<28;x++)s+=`<rect x="${x*U}" y="190" width="10" height="10" fill="#6aa84f"/><rect x="${x*U}" y="190" width="10" height="3" fill="#8acb68"/>`;
  CASTLE.forEach((b,i)=>{const cls=i<revealed?(i>=newFrom?'nw':''):'gh';const st=cls==='nw'?` style="animation-delay:${((i-newFrom)*0.03).toFixed(2)}s"`:'';
    s+=`<g class="${cls}"${st}><rect x="${b.x*U}" y="${b.y*U}" width="10" height="10" fill="${b.c}"/><rect x="${b.x*U}" y="${b.y*U}" width="10" height="2" fill="rgba(255,255,255,.22)"/><rect x="${b.x*U}" y="${b.y*U+8}" width="10" height="2" fill="rgba(0,0,0,.16)"/></g>`;});
  return s+'</svg>';}

function clockSVG(hr,mn){const cx=100,cy=100;let s=`<svg class="clock" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="94" fill="#fffaf0" stroke="#23303b" stroke-width="8"/>`;
  for(let i=0;i<60;i++){const a=i*Math.PI/30,r1=i%5?84:78;s+=`<line x1="${(cx+86*Math.sin(a)).toFixed(1)}" y1="${(cy-86*Math.cos(a)).toFixed(1)}" x2="${(cx+r1*Math.sin(a)).toFixed(1)}" y2="${(cy-r1*Math.cos(a)).toFixed(1)}" stroke="#23303b" stroke-width="${i%5?1.5:4}"/>`;}
  for(let i=1;i<=12;i++){const a=i*Math.PI/6;s+=`<text x="${(cx+64*Math.sin(a)).toFixed(1)}" y="${(cy-64*Math.cos(a)+9).toFixed(1)}" text-anchor="middle" font-family="Rubik,Arial" font-weight="900" font-size="24" fill="#23303b">${i}</text>`;}
  const ha=((hr%12)+mn/60)*Math.PI/6,ma=mn*Math.PI/30;
  s+=`<line x1="100" y1="100" x2="${(cx+44*Math.sin(ha)).toFixed(1)}" y2="${(cy-44*Math.cos(ha)).toFixed(1)}" stroke="#23303b" stroke-width="11" stroke-linecap="round"/>`;
  s+=`<line x1="100" y1="100" x2="${(cx+74*Math.sin(ma)).toFixed(1)}" y2="${(cy-74*Math.cos(ma)).toFixed(1)}" stroke="#3a8fc4" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="100" r="7" fill="#e4572e"/></svg>`;return s;}
function fracSVG(parts,shape){let s=`<svg class="frac" viewBox="0 0 200 200" aria-hidden="true">`;
  if(shape==='circle'){for(let i=0;i<parts;i++){const a0=i*2*Math.PI/parts-Math.PI/2,a1=(i+1)*2*Math.PI/parts-Math.PI/2;const x0=100+88*Math.cos(a0),y0=100+88*Math.sin(a0),x1=100+88*Math.cos(a1),y1=100+88*Math.sin(a1);
      s+=`<path d="M100 100 L${x0.toFixed(1)} ${y0.toFixed(1)} A88 88 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${i===0?'#f28c28':'#fff3c4'}" stroke="#23303b" stroke-width="4"/>`;}}
  else{const w=180/parts;for(let i=0;i<parts;i++)s+=`<rect x="${10+i*w}" y="50" width="${w}" height="100" fill="${i===0?'#3cb371':'#e8f5e1'}" stroke="#23303b" stroke-width="4"/>`;}
  return s+'</svg>';}
function pairsHTML(n){let s='<div class="pairs">';for(let i=0;i<Math.floor(n/2);i++)s+='<span><i></i><i></i></span>';if(n%2)s+='<span class="lone"><i></i></span>';return s+'</div>';}
function ptab(nums){let s='<div class="ptab"><span class="hd"></span><span class="hd">מֵאוֹת</span><span class="hd">עֲשָׂרוֹת</span><span class="hd">אֲחָדוֹת</span>';
  nums.forEach(n=>{s+=`<span>${n}</span><span>${n/100|0}</span><span>${(n%100)/10|0}</span><span>${n%10}</span>`;});return s+'</div>';}

   bin  {l,op,r,res,miss,ans,t?,f?,pre?}     add3 {a,b,c,res,ans}     rem {p,d,qq,r}
   col  {op,a,b,res,g?}                       word {tx,ans,u,h1,st,nt?}
   eq   {toks,ans,h1,st}                      ch   {pr,opts,ans,h1,h2,ltr,cls}
   ===================================================================== */
const B=(l,op,r,miss='res',t)=>{const res=op==='+'?l+r:op==='−'?l-r:op==='×'?l*r:l/r;const q={k:'bin',l,op,r,res,miss,ans:miss==='res'?res:miss==='r'?r:l};if(t)q.t=t;return q;};
const W=(tx,ans,u,h1,st,nt)=>{const q={k:'word',tx,ans,u,h1,st};if(nt)q.nt=1;return q;};
const EQ=(toks,ans,h1,st)=>({k:'eq',toks,ans,h1,st});
const CH=(pr,opts,ans,h1,h2,ltr,cls)=>({k:'ch',pr,opts,ans,h1,h2,ltr:!!ltr,cls:cls||''});
const qkey=q=>q.k==='word'?q.tx:q.k==='ch'?q.pr+'|'+q.opts.join():q.k==='eq'?q.toks.join(' '):JSON.stringify([q.k,q.l,q.op,q.r,q.miss,q.a,q.b,q.c,q.p,q.d]);
function uniq(gen,n){const out=[],seen=new Set();let t=0;while(out.length<n&&t++<800){const q=gen(out.length);const k=qkey(q);if(seen.has(k))continue;seen.add(k);out.push(q);}return out;}

  for(let i=0;i<hh;i++)s+='<div class="flat">'+'<i></i>'.repeat(100)+'</div>';
  for(let i=0;i<t;i++)s+='<div class="rod">'+'<i></i>'.repeat(10)+'</div>';
  if(o)s+='<div class="ones">'+'<i class="one"></i>'.repeat(o)+'</div>';return s+`</div><div class="btlbl">${n}</div></div>`;}

    const n=mm(.5)?rand(2,20):rand(21,999);const odd=n%2;

  forest:{bpm:88,root:55,sc:'maj',prog:[0,4,5,3],lead:'square',dr:1},cave:{bpm:76,root:57,sc:'dor',prog:[0,6,3,4],lead:'triangle',dr:0},
  mount:{bpm:100,root:64,sc:'maj',prog:[0,4,3,4],lead:'square',dr:1},sea:{bpm:82,root:53,sc:'lyd',prog:[0,1,0,4],lead:'sine',dr:0},

const MV=.45;

function mkPhrase(th,seed){let r=seed;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280;};const RH=[[0,4,8,12],[0,6,8,12,14],[0,2,4,8,10,12],[0,4,6,8,12],[0,3,6,8,12]];const out=[];let deg=4;

  return out;}
const degNote=(th,deg,oct)=>{const sc=SC[th.sc];const o=Math.floor(deg/7),i=((deg%7)+7)%7;return th.root+12*(oct+o)+sc[i];};

function kick(t,b){tone(130,t,.16,{type:'sine',vol:.2,slide:42,bus:b});}
function schedStep(th,step,t,spb){const b=A.musicBus,bar=Math.floor(step/16)%4,s=step%16,ph=Math.floor(step/64)%4,ch=th.prog[bar];
  if(s===0||s===8||(th.dr>=2&&s===12))tone(NT(degNote(th,ch,-2)),t,spb*(s===0?3:2),{type:'triangle',vol:.12,bus:b,lp:1000});
  if(th.dr===3&&s%4===2)tone(NT(degNote(th,ch+4,-2)),t,spb,{type:'triangle',vol:.08,bus:b,lp:900});
  if(s%2===0){const d=ch+[0,2,4,7][(s/2)%4];tone(NT(degNote(th,d,0)),t,spb*1.7,{type:th.lead==='sine'?'sine':'triangle',vol:.02,bus:b,lp:2200});}

  if(q.k==='rem'){const {p,d,qq,r}=q;return {v:cap(`כַּמָּה פְּעָמִים ${L_(d)} נִכְנָס בְּ-${L_(p)}?`)+skipS(d,Math.max(qq,1),false),s:[`${qq} × ${d} = ${qq*d}`,`${p} − ${qq*d} = ${r}`]};}

    const v=cap(cap1)+`<div class="bt">${baseTen(l,'#e8873a')}</div>`;
    if(tens(r)&&r%10)return {v,s:[`${l} − ${tens(r)} = ${l-tens(r)}`,`${l-tens(r)} − ${r%10} = ?`]};
    if(!tens(r)&&r<=l%10)return {v,s:[`${l%10} − ${r} = ${l%10-r}`,`${tens(l)} + ${l%10-r} = ?`]};
    if(!tens(r)&&r>l%10)return l%10?{v,s:[`${l} − ${l%10} = ${tens(l)}`,`${tens(l)} − ${r-l%10} = ?`]}:{v,s:[`10 − ${r} = ${10-r}`,`${l-10} + ${10-r} = ?`]};
    return {v,s:[`${tens(l)} − ${tens(r)} = ${tens(l)-tens(r)}`,`${tens(l)-tens(r)} + ${l%10} = ?`]};
  }
  if(op==='×'){
    if(miss!=='res'){const k=miss==='r'?l:r;return {v:cap(`קְפִיצוֹת שֶׁל ${L_(k)} עַד ${L_(res)}. כַּמָּה קְפִיצוֹת?`)+skipS(k,res/k,false),s:[`${res} : ${k} = ?`]};}
    if(l===0||r===0)return {v:cap('כָּל מִסְפָּר כָּפוּל 0 הוּא 0'),s:[`${l} × ${r} = ?`]};
    if(l===1||r===1)return {v:cap('כָּל מִסְפָּר כָּפוּל 1 נִשְׁאָר אוֹתוֹ מִסְפָּר'),s:[`${l} × ${r} = ?`]};
    if(t==='x10b'){const n=l===10?r:l;return {v:cap('כּוֹפְלִים בְּ-10 ← מוֹסִיפִים 0 בַּסּוֹף'),s:n>=10?[`${tens(n)} × 10 = ${tens(n)*10}`,`${n%10} × 10 = ${n%10*10}`,`${tens(n)*10} + ${n%10*10} = ?`]:[`${n} × 10 = ?`]};}
    if(t==='x100'){const n=l===100?r:l;return {v:cap('כּוֹפְלִים בְּ-100 ← מוֹסִיפִים שְׁנֵי אֲפָסִים'),s:[`${n} × 10 = ${n*10}`,`${n*10} × 10 = ?`]};}
    if(t==='x10'){const k=l%10===0?r:l,tt=l%10===0?l:r;return {v:cap(`${L_(k+' × '+tt/10+' = '+k*tt/10)} ← וְעַכְשָׁו פִּי 10`),s:[`${k} × ${tt/10} = ${k*tt/10}`,`${k*tt/10} × 10 = ?`]};}
    if(t==='x21'){const big=l>10?l:r,k=l>10?r:l,t0=tens(big),u=big%10;return {v:cap(`מְפָרְקִים אֶת ${L_(big)} לַעֲשָׂרוֹת וַאֲחָדוֹת`)+`<div class="bt">${baseTen(big,'#e8873a')}</div>`,s:u?[`${t0} × ${k} = ${t0*k}`,`${u} × ${k} = ${u*k}`,`${t0*k} + ${u*k} = ?`]:[`${t0} × ${k} = ?`]};}
    return {v:cap(`${L_(l)} קְבוּצוֹת שֶׁל ${L_(r)}`)+arr(l,r,sz(l,r)),s:[]};
  }
  if(miss==='r')return {v:cap(`${L_('? × '+res+' = '+l)}<br>קְפִיצוֹת שֶׁל ${L_(res)} עַד ${L_(l)}. כַּמָּה קְפִיצוֹת?`)+skipS(res,l/res,false),s:[`${l} : ${res} = ?`]};
  if(t==='d10')return {v:cap('מְחַלְּקִים בְּ-10 ← מוֹרִידִים אֶפֶס מֵהַסּוֹף'),s:[`${res} × 10 = ${l}`,`${l} : 10 = ?`]};
  if(t==='d21'){const big=res,t0=tens(big),u=big%10;return {v:cap(`מְפָרְקִים אֶת ${L_(l)}`)+`<div class="bt">${baseTen(l,'#e8873a')}</div>`,s:u?[`${t0*r} : ${r} = ${t0}`,`${u*r} : ${r} = ${u}`,`${t0} + ${u} = ?`]:[`${l/10} : ${r} = ${res/10}`,`${res/10} × 10 = ?`]};}

}
function hintHTML(q,level){

/* ---------- column arithmetic ---------- */
const digs=n=>String(n).split('').reverse().map(Number);
function colInit(q){const A=digs(q.a),Bd=digs(q.b),R=digs(q.res);return {A,B:Bd,R,W:Math.max(A.length,Bd.length,R.length),tops:A.slice(),marks:{},carries:{},typed:[],c:0,ct:0,state:[]};}
function colNeedBorrow(st,c){return (st.tops[c]|0)<(st.B[c]|0);}
function colBorrow(st,c){st.tops[c]+=10;st.marks[c]=st.tops[c];let j=c+1;while(st.tops[j]===0){st.tops[j]=9;st.marks[j]=9;j++;}st.tops[j]-=1;st.marks[j]=st.tops[j];sfx.carry();}
function colHint(q,st){const c=st.c;
  if(q.op==='+'){const a=st.A[c]|0,b=st.B[c]|0,ci=st.carries[c]|0;if(c>=st.A.length&&c>=st.B.length)return cap('מוֹרִידִים אֶת הַ-1 לְמַטָּה');
    const s=a+b+ci;return steps([`${a} + ${b}${ci?' + 1':''} = ${s}`])+cap(s>=10?`כּוֹתְבִים ${L_(s%10)} וּמַעֲבִירִים 1`:`כּוֹתְבִים ${L_(s)}`);}
  if(colNeedBorrow(st,c)){const old=st.tops[c];colBorrow(st,c);renderCol(q,st);return cap(`${L_(old)} קָטָן מִ-${L_(st.B[c])} ← פּוֹרְטִים ${c===0?'עֶשֶׂרֶת':'מֵאָה'}`)+steps([`${st.tops[c]} − ${st.B[c]|0} = ?`]);}
  return steps([`${st.tops[c]} − ${st.B[c]|0} = ?`]);}
function renderCol(q,st){const box=$('#colw');if(!box)return;const W2=st.W;box.style.gridTemplateColumns=`repeat(${W2+1},var(--cw))`;let s='';const cell=(c2,cls='')=>`<div class="cc ${cls}">${c2}</div>`;
  s+=cell('','mk');for(let g=1;g<=W2;g++){const c=W2-g;const m=q.op==='+'?(st.carries[c]?'1':''):(st.marks[c]!=null?st.marks[c]:'');s+=cell(m,'mk'+(q.op==='+'?' cr':''));}
  s+=cell('');for(let g=1;g<=W2;g++){const c=W2-g;s+=cell(c<st.A.length?st.A[c]:'',st.marks[c]!=null?'x':'');}
  s+=cell(q.op,'op');for(let g=1;g<=W2;g++){const c=W2-g;s+=cell(c<st.B.length?st.B[c]:'');}
  s+='<div class="cline"></div><div class="cempty"></div>';
  for(let g=1;g<=W2;g++){const c=W2-g;if(c>=st.R.length){s+='<div class="cempty"></div>';continue;}const v=st.typed[c];const cls=v!=null?(st.state[c]==='show'?'show':'ok'):(c===st.c?'cur':'');s+=`<div class="cb ${cls}" id="cb${c}">${v!=null?v:''}</div>`;}
  box.innerHTML=s;}
function colPrep(q,st){if(q.op==='−'&&q.g&&st.c<st.R.length&&colNeedBorrow(st,st.c))colBorrow(st,st.c);renderCol(q,st);
  const hb=$('#hint');if(q.g&&hb&&st.c<st.R.length){hb.hidden=false;hb.innerHTML=colHint(q,st);}}
function colAdvance(q,st,digit,shown){const c=st.c;st.typed[c]=digit;st.state[c]=shown?'show':'ok';
  if(q.op==='+'){const s=(st.A[c]|0)+(st.B[c]|0)+(st.carries[c]|0);if(s>=10){st.carries[c+1]=1;sfx.carry();}}else if(colNeedBorrow(st,c))colBorrow(st,c);
  st.c++;st.ct=0;}

/* ---------- question rendering ---------- */
function preHTML(q){
  if(q.pre==='rep')return `<div class="pre">${arr(q.l,q.r,22)}<div class="cap2">${Array(q.l).fill(q.r).join(' + ')}</div></div>`;
  if(q.pre==='share')return `<div class="pre"><div class="pile">${SPR.gem.repeat(q.l)}</div><div class="cap"><span><span class="ltr">${q.l}</span> יַהֲלוֹמִים, <span class="ltr">${q.r}</span> תֵּבוֹת</span></div></div>`;
  return '';}
const ISOP=t=>['+','−','×',':','=',','].includes(t);
function questionHTML(q,isStatic,solved){
  const box=(v,i)=>solved?`<span class="ans show">${v}</span>`:`<span class="ans empty" data-b="${i}">?</span>`;
  if(q.k==='word')return `<div class="wcard">${q.tx}</div><div class="wans">תְּשׁוּבָה: ${box(q.ans,0)} <span>${q.u||''}</span></div>`;
  if(q.k==='eq')return `<div class="eqcard">${q.toks.map(t=>t==='?'?box(q.ans,0):`<span class="${ISOP(t)?'op':''}">${t}</span>`).join('')}</div>`;
  if(q.k==='ch'){let pr=q.pr;if(solved&&q.cls==='sym')pr=pr.replace('<span class="slot">?</span>',`<span class="ans show">${q.opts[q.ans]}</span>`);return `<div class="prq">${pr}</div>`;}
  if(q.k==='add3')return `<div class="eqcard"><span>${q.a}</span><span class="op">+</span><span>${q.b}</span><span class="op">+</span><span>${q.c}</span><span class="op">=</span>${box(q.ans,0)}</div>`;
  if(q.k==='rem')return `<div class="eqcard"><span>${q.p}</span><span class="op">:</span><span>${q.d}</span><span class="op">=</span>${box(q.qq,0)}<span class="wd">שְׁאֵרִית</span>${box(q.r,1)}</div>`;
  const cell=(v,key)=>q.miss===key?box(q.ans,0):`<span>${v}</span>`;
  return preHTML(q)+`<div class="eqcard">${cell(q.l,'l')}<span class="op">${q.op}</span>${cell(q.r,'r')}<span class="op">=</span>${cell(q.res,'res')}</div>`;}
function choicesStatic(q,solved){return `<div class="chs ${q.ltr?'ltr':''}">${q.opts.map((o,i)=>`<span class="chb ${q.cls} ${solved&&i===q.ans?'show':''}">${o}</span>`).join('')}</div>`;}
const answersOf=q=>q.k==='rem'?[q.qq,q.r]:[q.ans];
function qSpeech(q){
  if(q.k==='word')return q.tx;
  if(q.k==='ch')return plain(q.pr.replace(/<svg[\s\S]*?<\/svg>/g,''))+' '+q.opts.map(o=>({'<':'קטן','>':'גדול','=':'שווה'}[o]||o)).join(', ');
  if(q.k==='eq')return q.toks.map(t=>t==='?'?'כמה':typeof t==='number'?nw(t):OPW[t]||t).join(' ');
  if(q.k==='add3')return `${nw(q.a)} ועוד ${nw(q.b)} ועוד ${nw(q.c)}, שווה כמה?`;
  if(q.k==='rem')return `${nw(q.p)} חלקי ${nw(q.d)}, שווה כמה, ומה השארית?`;
  if(q.k==='col')return `${nw(q.a)} ${OPW[q.op]} ${nw(q.b)}. פותרים במאונך, מהאחדות.`;
  return [q.miss==='l'?'כמה':nw(q.l),OPW[q.op],q.miss==='r'?'כמה':nw(q.r),'שווה',q.miss==='res'?'כמה':nw(q.res)].join(' ')+'?';}
function bubbleOpts(q){const a=q.ans;const c=new Set([a]);const cand=[a+1,a-1,a+2,a-2,a+10,a-10];if(q.k==='bin'&&q.op==='×'&&q.miss==='res'){cand.unshift(q.l*(q.r+1),q.l*(q.r-1),(q.l+1)*q.r);}
  if(a>=10){const s=String(a);if(s.length===2&&s[0]!==s[1])cand.unshift(+(s[1]+s[0]));}
  for(const v of shuffle(cand.slice(0,3)).concat(cand.slice(3)))if(c.size<4&&v>=0&&v!==a)c.add(v);while(c.size<4)c.add(a+c.size*3);return shuffle([...c]);}
