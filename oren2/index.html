<title>המסע של אורן</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap">
<style>
/* Layout: one-screen blocky adventure. HUD on top, scrollable screen area, grass strip at the bottom.
   Single deliberate look (sky world per land); every color set explicitly. */
:root{
  --ink:#23303b; --ink-soft:#4a5a66; --paper:#fffaf0;
  --birch:#f4e4c1; --grass:#6aa84f; --grass-l:#8acb68; --dirt:#8b5e3c; --dirt-d:#6e4a2f;
  --wood:#c8925a; --wood-d:#94613a; --stone:#9aa1a8; --stone-d:#6b737a;
  --gold:#ffcf4d; --ok:#4fbf63; --ok-d:#2f8f43; --bad:#e2735f; --blue:#3a8fc4;
  --sky1:#8ccbea; --sky2:#eaf5f0;
  --font:'Rubik','Segoe UI',Arial,sans-serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky2);color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #1f6feb;outline-offset:3px}
button:disabled{cursor:default}
svg.px{shape-rendering:crispEdges;display:block}
.ltr{direction:ltr;unicode-bidi:isolate}

#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 85%);transition:background 1s}
#app[data-sky="forest"]{--sky1:#7cc3a0;--sky2:#e3f3dc}
#app[data-sky="cave"]{--sky1:#3b3650;--sky2:#7c7593}
#app[data-sky="mount"]{--sky1:#a9d3f5;--sky2:#f1f7fb}
#app[data-sky="sea"]{--sky1:#2f8fb0;--sky2:#bfe9ef}
#app[data-sky="final"]{--sky1:#5b3f8c;--sky2:#f2a98b}
#app[data-sky="night"]{--sky1:#16213e;--sky2:#3d4f7c}

.clouds{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;display:block;background:#fff;opacity:.8;width:120px;height:24px;
  box-shadow:24px -24px 0 #fff,48px -24px 0 #fff,72px 0 0 #fff,96px 0 0 #fff;animation:drift 90s linear infinite}
.c1{top:12%;left:-200px}.c2{top:26%;left:-200px;animation-delay:-35s;transform:scale(.7)}.c3{top:8%;left:-200px;animation-delay:-62s;transform:scale(.5)}
@keyframes drift{to{left:110%}}
#app[data-sky="cave"] .cloud,#app[data-sky="final"] .cloud,#app[data-sky="night"] .cloud{opacity:.15}
.hills{position:absolute;left:0;right:0;bottom:30px;height:120px;pointer-events:none;opacity:.35;
  background:linear-gradient(transparent 0 0);}
#app[data-sky="mount"] .hills{background:
  linear-gradient(135deg,transparent 50%,#fff 50%) 0 0/120px 120px repeat-x,
  linear-gradient(225deg,transparent 50%,#d8e6f0 50%) 0 0/120px 120px repeat-x}
#app[data-sky="sea"] .hills{height:50px;opacity:.5;background:repeating-linear-gradient(90deg,#1f7a99 0 30px,#2b8eaf 30px 60px)}

.ground{flex:0 0 32px;position:relative;z-index:1;
  background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(0,0,0,.12) 34px 36px),
  linear-gradient(180deg,var(--grass-l) 0 6px,var(--grass) 6px 14px,var(--dirt) 14px 100%)}
#app[data-sky="cave"] .ground{background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(0,0,0,.2) 34px 36px),linear-gradient(#6b737a 0 8px,#4d5359 8px)}
#app[data-sky="sea"] .ground{background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(0,0,0,.08) 34px 36px),linear-gradient(#f1dca0 0 8px,#d9bf7c 8px)}

/* HUD */
.hud{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-block:8px;padding-left:var(--gut);padding-right:var(--gut-r);min-height:56px}
.hud-side{display:flex;gap:8px;min-width:112px}
.hud-side.end{justify-content:flex-end}
.hud-mid{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;min-width:0}
.ibtn{width:50px;height:50px;display:grid;place-items:center;background:var(--birch);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.18),inset 4px 4px 0 rgba(255,255,255,.6),0 4px 0 rgba(0,0,0,.25);transition:transform .12s}
.ibtn svg{width:28px;height:28px}
.ibtn.off{opacity:.5}
.chip{font-weight:800;font-size:21px;background:rgba(255,255,255,.88);padding:6px 14px;box-shadow:0 4px 0 rgba(0,0,0,.18);white-space:nowrap}
.progress{display:flex;gap:4px;direction:ltr;flex-wrap:wrap;max-width:360px}
.pb{width:22px;height:22px;background:rgba(255,255,255,.45);box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}
.pb.on{background:var(--grass);box-shadow:inset 0 5px 0 var(--grass-l),inset -3px -3px 0 rgba(0,0,0,.2);animation:pop .4s}
.pb.cur{background:#fff;box-shadow:inset 0 0 0 3px var(--gold)}
.streak{display:flex;align-items:center;gap:4px;font-weight:900;font-size:24px;background:rgba(255,255,255,.88);padding:2px 10px;box-shadow:0 4px 0 rgba(0,0,0,.18);direction:ltr}
.streak svg{width:24px}
.streak.hot{animation:pop .4s}
.starcount{display:flex;align-items:center;gap:8px;font-weight:900;font-size:24px;direction:ltr;background:rgba(255,255,255,.88);padding:4px 12px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.starcount svg{width:28px}

.screens{flex:1;position:relative;z-index:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen{flex:1 0 auto;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding-block:8px;padding-left:var(--gut);padding-right:var(--gut-r);animation:fadein .45s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{40%{transform:scale(1.18)}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.shake{animation:shake .45s}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

/* buttons */
.bigbtn{display:inline-flex;align-items:center;gap:12px;font-weight:900;font-size:30px;color:#fff;padding:14px 36px;
  background:var(--ok);box-shadow:inset -6px -6px 0 var(--ok-d),inset 6px 6px 0 rgba(255,255,255,.35),0 7px 0 rgba(0,0,0,.3);transition:transform .12s}
.bigbtn svg{width:34px;height:34px}
.bigbtn.blue{background:var(--blue);box-shadow:inset -6px -6px 0 #23698f,inset 6px 6px 0 rgba(255,255,255,.3),0 7px 0 rgba(0,0,0,.3)}
.bigbtn.plain{background:var(--birch);color:var(--ink);box-shadow:inset -6px -6px 0 rgba(0,0,0,.15),inset 6px 6px 0 rgba(255,255,255,.6),0 7px 0 rgba(0,0,0,.25)}
.bigbtn.sm{font-size:22px;padding:10px 22px}.bigbtn.sm svg{width:26px;height:26px}
.btnrow{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
@media (hover:hover){
  .ibtn:hover,.bigbtn:hover,.key:hover,.land:hover,.node:not(:disabled):hover,.tcell:hover{transform:translateY(-3px)}
}
.ibtn:active,.bigbtn:active,.key:active{transform:translateY(3px)}

/* START */
.title{font-weight:900;font-size:clamp(44px,7vw,92px);margin:0;color:#fff;text-align:center;line-height:1.1;
  text-shadow:5px 5px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.scene{display:flex;align-items:flex-end;gap:22px;justify-content:center;flex-wrap:wrap}
.scene .s-oren svg{width:84px}.scene .s-cat svg{width:84px}.scene .s-giant svg{width:120px}.scene .s-castle svg{width:280px}
.note{font-size:16px;color:var(--ink-soft);background:rgba(255,255,255,.75);padding:6px 12px}

/* MAP */
.mapgrid{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.lands{display:grid;grid-template-columns:repeat(3,minmax(150px,190px));gap:16px}
.land{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 10px 12px;min-height:170px;
  background:var(--birch);box-shadow:inset -6px -6px 0 rgba(0,0,0,.14),inset 6px 6px 0 rgba(255,255,255,.55),0 6px 0 rgba(0,0,0,.25);transition:transform .15s}
.land::before{content:"";position:absolute;inset:0 0 auto;height:14px;background:var(--lc);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.land .ico{height:64px;display:grid;place-items:center}.land .ico svg{height:58px;width:auto}
.land .nm{font-weight:800;font-size:19px;text-align:center}
.land .op{position:absolute;top:20px;inset-inline-start:8px;font-weight:900;font-size:22px;width:34px;height:34px;display:grid;place-items:center;background:var(--lc);color:#fff}
.land .bar{width:100%;height:12px;background:rgba(0,0,0,.1)}
.land .bar i{display:block;height:100%;background:var(--gold)}
.land .cnt{font-size:15px;font-weight:700;color:var(--ink-soft);direction:ltr;display:flex;gap:4px;align-items:center}
.land .cnt svg{width:16px}
.land.locked{filter:grayscale(.8);opacity:.75}
.land .lk{position:absolute;top:18px;inset-inline-end:8px;width:28px}
.castlepanel{display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(255,255,255,.55);padding:14px 18px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.castlepanel h2{margin:0;font-size:22px;font-weight:900}
.castlepanel .cs svg{width:320px;max-width:100%}
.castlepanel .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.reset{font-size:13px;color:var(--ink-soft);opacity:.6;padding:6px 8px;background:rgba(255,255,255,.4)}
.reset.hold{opacity:1;background:var(--bad);color:#fff}

/* LAND */
.landhead{display:flex;align-items:center;gap:14px}
.landhead .ico svg{height:56px;width:auto}
.landhead h1{margin:0;font-size:40px;font-weight:900;color:#fff;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.path{display:flex;flex-wrap:wrap;gap:22px 18px;justify-content:center;max-width:1000px;direction:ltr}
.node{position:relative;width:128px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 10px;
  background:var(--paper);box-shadow:inset -5px -5px 0 rgba(0,0,0,.14),inset 5px 5px 0 #fff,0 6px 0 rgba(0,0,0,.28);transition:transform .15s}
.node .lbl{font-weight:900;font-size:30px;direction:ltr;white-space:nowrap}
.node .no{position:absolute;top:-12px;left:-10px;width:28px;height:28px;display:grid;place-items:center;font-weight:900;font-size:15px;background:var(--ink);color:#fff}
.node .st{display:flex;gap:2px}.node .st svg{width:24px}
.node.boss{width:170px;background:#efe7ff}
.node.boss .gi svg{width:64px}
.node:disabled{filter:grayscale(1);opacity:.55}
.node:disabled .lk{position:absolute;inset:0;display:grid;place-items:center}
.node:disabled .lk svg{width:34px}
.node.next{box-shadow:0 0 0 5px var(--gold),0 0 22px var(--gold),0 6px 0 rgba(0,0,0,.28);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px var(--gold),0 0 6px var(--gold),0 6px 0 rgba(0,0,0,.28)}}

/* PLAY */
.play{width:min(1120px,100%);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:26px;align-items:center}
.left{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.talk{display:flex;align-items:center;gap:12px;min-height:64px}
.cat svg{width:62px}
.cat.hop{animation:hop .6s}.cat.tilt{animation:tilt .6s}
@keyframes hop{30%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
@keyframes tilt{30%{transform:rotate(-10deg)}70%{transform:rotate(8deg)}}
.bubble{position:relative;display:flex;align-items:center;gap:10px;font-weight:800;font-size:24px;background:#fff;padding:10px 18px;box-shadow:0 5px 0 rgba(0,0,0,.18);min-height:52px}
.bubble::before{content:"";position:absolute;inset-inline-start:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-inline-end:14px solid #fff;border-inline-start:0}
.bubble svg{width:26px;height:26px;flex:none;color:var(--blue)}
.bossrow{display:flex;align-items:center;gap:18px}
.giant svg{width:110px}
.giant.hit{animation:hit .5s}
.giant.laugh{animation:laugh .6s}
.giant.down{animation:down 1s forwards}
@keyframes hit{20%{transform:translateX(10px) rotate(6deg);filter:brightness(1.8)}50%{transform:translateX(-6px)}}
@keyframes laugh{25%{transform:translateY(-10px) scaleY(1.05)}50%{transform:translateY(0)}75%{transform:translateY(-6px)}}
@keyframes down{to{transform:translateY(40px) rotate(-20deg);opacity:0}}
.hp{display:flex;gap:3px;direction:ltr;flex-wrap:wrap;max-width:240px}
.hp i{width:18px;height:22px;background:#e4572e;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.3)}
.hp i.gone{background:rgba(0,0,0,.15);box-shadow:none}
.eqcard{position:relative;display:flex;align-items:center;gap:16px;direction:ltr;font-weight:900;font-size:68px;font-variant-numeric:tabular-nums;
  background:var(--paper);padding:14px 30px;box-shadow:inset -6px -6px 0 rgba(0,0,0,.1),inset 6px 6px 0 #fff,0 8px 0 rgba(0,0,0,.28)}
.eqcard .op{color:var(--blue)}
.ans{min-width:1.6em;padding:0 10px;text-align:center;background:#fff3c4;box-shadow:inset 0 -6px 0 var(--gold);color:var(--ink)}
.ans.empty{color:rgba(0,0,0,.25)}
.ans.ok{background:var(--ok);color:#fff;box-shadow:none;animation:pop .4s}
.ans.bad{background:var(--bad);color:#fff;box-shadow:none}
.ans.show{background:var(--blue);color:#fff;box-shadow:none}
.praise{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:30px;font-weight:900;color:var(--ok-d);background:#fff;padding:2px 16px;white-space:nowrap;direction:rtl;
  box-shadow:0 4px 0 rgba(0,0,0,.2);animation:praise 1s forwards;pointer-events:none}
@keyframes praise{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}25%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.hintbox{width:100%;max-width:720px;min-height:40px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;background:rgba(255,255,255,.72);box-shadow:0 5px 0 rgba(0,0,0,.12);animation:fadein .35s}
.hintbox .cap{font-weight:800;font-size:22px;text-align:center}
.hintbox .cap .ltr{display:inline-block}
.hintbtn{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:20px;padding:8px 16px;background:#fff3c4;box-shadow:inset -4px -4px 0 rgba(0,0,0,.12),0 4px 0 rgba(0,0,0,.2)}
.hintbtn svg{width:24px;height:24px}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:10px;direction:ltr}
.key{height:72px;display:grid;place-items:center;font-weight:900;font-size:36px;background:var(--birch);
  box-shadow:inset -5px -5px 0 rgba(0,0,0,.16),inset 5px 5px 0 rgba(255,255,255,.6),0 6px 0 rgba(0,0,0,.28);transition:transform .1s}
.key.go{background:var(--ok);color:#fff;box-shadow:inset -5px -5px 0 var(--ok-d),inset 5px 5px 0 rgba(255,255,255,.3),0 6px 0 rgba(0,0,0,.28)}
.key svg{width:32px;height:32px}
.key.press{transform:translateY(3px);filter:brightness(.92)}

/* hint visuals */
.tf{display:flex;gap:14px;direction:ltr;flex-wrap:wrap;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,30px);gap:4px;padding:6px;background:#fff;box-shadow:inset 0 0 0 3px #c9b98f}
.frame i{width:30px;height:30px;position:relative;background:#f1ece0}
.frame i.a{background:#e8873a;box-shadow:inset -3px -3px 0 rgba(0,0,0,.2)}
.frame i.b{background:#3a8fc4;box-shadow:inset -3px -3px 0 rgba(0,0,0,.2)}
.frame i.x{background:#e8873a;opacity:.35}
.frame i.x::after{content:"";position:absolute;left:-2px;right:-2px;top:13px;height:4px;background:#b23a2a;transform:rotate(-45deg)}
.frame i.e{background:#fff;box-shadow:inset 0 0 0 3px #3a8fc4}
.bt{display:flex;gap:26px;direction:ltr;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.btn10{display:flex;gap:5px;align-items:flex-end}
.rod{display:flex;flex-direction:column;gap:1px;padding:1px;background:rgba(0,0,0,.15)}
.rod i,.one{display:block;width:14px;height:11px;background:var(--c,#e8873a)}
.one{width:14px;height:14px;box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.ones{display:grid;grid-template-columns:repeat(2,14px);gap:2px;align-content:end}
.btlbl{font-weight:900;font-size:22px;text-align:center;margin-top:4px}
.btwrap{display:flex;flex-direction:column;align-items:center}
.steps{display:flex;flex-direction:column;gap:4px;direction:ltr;font-weight:900;font-size:30px;font-variant-numeric:tabular-nums}
.steps div{background:#fff;padding:2px 14px;box-shadow:0 3px 0 rgba(0,0,0,.12);animation:fadein .4s backwards}
.steps div:nth-child(2){animation-delay:.4s}.steps div:nth-child(3){animation-delay:.8s}
.steps b{color:var(--blue)}
.skip{display:flex;gap:4px;direction:ltr;flex-wrap:wrap;justify-content:center;max-width:680px}
.skip b{min-width:46px;height:42px;padding:0 4px;display:grid;place-items:center;font-size:22px;font-weight:900;background:#fff;box-shadow:inset 0 -4px 0 var(--gold);position:relative}
.skip b.q{background:var(--gold);box-shadow:none}
.skip b small{position:absolute;top:-12px;right:-4px;font-size:12px;background:var(--blue);color:#fff;padding:0 4px;line-height:16px}
.arr{display:flex;flex-direction:column;gap:3px;direction:ltr}
.arr .r{display:flex;gap:3px;align-items:center}
.arr .r i{width:var(--s,18px);height:var(--s,18px);background:var(--c);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.arr .r small{width:22px;font-size:13px;font-weight:800;color:var(--ink-soft);text-align:center}
.share{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;direction:ltr}
.box{min-width:70px;min-height:60px;padding:8px 6px 6px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-end;background:#c8925a;box-shadow:inset 0 -5px 0 var(--wood-d),inset 0 5px 0 rgba(255,255,255,.2);max-width:110px;position:relative}
.box svg{width:18px}
.box .bn{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-weight:900;font-size:16px;background:#fff;padding:0 8px}

/* LEARN */
.learn{width:min(1100px,100%);display:flex;flex-direction:column;align-items:center;gap:14px}
.learn h1{margin:0;font-size:38px;font-weight:900;color:#fff;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.lgrid{display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap}
.lpanel{background:rgba(255,255,255,.75);padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.14);min-height:220px;display:grid;place-items:center}
.facts{display:grid;grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:4px 22px;direction:ltr;font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
.facts div{opacity:.25;transition:opacity .3s}
.facts div.on{opacity:1}
.facts div.cur{color:var(--ok-d);animation:pop .4s}
.pile{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:420px;min-height:40px}
.pile svg,.dealbox svg{width:26px}
.dealrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;direction:ltr}
.dealbox{width:110px;min-height:90px;padding:10px 6px 6px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-end;background:#c8925a;box-shadow:inset 0 -6px 0 var(--wood-d),inset 0 6px 0 rgba(255,255,255,.2)}
.dealbox svg{animation:drop .35s}
@keyframes drop{from{transform:translateY(-40px);opacity:0}}
.bigeq{font-weight:900;font-size:56px;direction:ltr;background:var(--paper);padding:6px 26px;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:pop .5s}
.lcap{font-weight:800;font-size:24px;background:rgba(255,255,255,.85);padding:6px 16px;text-align:center}

/* TABLE */
.tgrid{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;width:min(640px,100%);direction:ltr}
.tgrid .hd{display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;background:var(--ink);aspect-ratio:1}
.tcell{position:relative;display:grid;place-items:center;aspect-ratio:1;font-weight:800;font-size:clamp(12px,2.2vw,20px);background:rgba(255,255,255,.55);color:rgba(0,0,0,.35);transition:transform .12s}
.tcell.m{color:#fff;background:var(--c);box-shadow:inset -3px -3px 0 rgba(0,0,0,.2),inset 3px 3px 0 rgba(255,255,255,.3),0 0 10px var(--c)}
.tcell .dv{position:absolute;top:2px;right:2px;width:9px;height:9px;background:#3cc8bb;transform:rotate(45deg);box-shadow:0 0 0 1px #fff}
.tlegend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:16px;background:rgba(255,255,255,.75);padding:6px 14px}
.tlegend span{display:flex;align-items:center;gap:6px}
.tlegend i{display:inline-block;width:16px;height:16px;background:#e4572e}
.tlegend i.d{width:10px;height:10px;background:#3cc8bb;transform:rotate(45deg)}

/* overlay */
.overlay{position:absolute;inset:0;z-index:5;display:flex;overflow-y:auto;padding:22px 16px;background:rgba(20,30,40,.6);animation:fadein .4s}
.overlay>*{margin:auto}
.card{display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--paper);padding:22px 36px;max-width:100%;
  box-shadow:0 0 0 8px var(--grass),0 0 0 14px var(--dirt),0 16px 0 14px rgba(0,0,0,.25)}
.card h2{margin:0;font-size:40px;font-weight:900;text-align:center}
.card .stars{display:flex;gap:10px;direction:ltr}
.card .stars span svg{width:78px}
.card .stars span{animation:spin .7s cubic-bezier(.2,.9,.3,1.3) backwards}
@keyframes spin{from{transform:scale(0) rotate(-180deg)}}
.card .cs svg{width:300px;max-width:100%}
.castle .gh{opacity:.15}
.castle .nw{animation:drop .5s backwards}

/* FINAL */
.final{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;padding:22px 44px 16px;text-align:center;max-width:calc(100% - 40px);
  box-shadow:0 0 0 10px #8e6fd1,0 0 0 18px #5b3f8c,0 18px 0 18px rgba(0,0,0,.2)}
.final .t1{font-weight:900;font-size:24px;letter-spacing:4px;color:#8e6fd1}
.final .nm{font-weight:900;font-size:clamp(44px,7vw,76px);line-height:1.05}
.final .rl{font-weight:800;font-size:28px;color:var(--blue)}
.final .cs svg{width:300px;max-width:100%}
.final .facts2{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:20px}
.final .facts2 span{display:flex;gap:6px;align-items:center;direction:ltr}
.final .facts2 svg{width:24px}

#fx{position:absolute;inset:0;pointer-events:none;z-index:6}

/* compact: phones and short windows */
@media (max-width:760px),(max-height:560px){
  .hud{padding-block:5px;min-height:0;gap:6px}
  .hud-side{min-width:0;gap:5px}
  .ibtn{width:40px;height:40px}.ibtn svg{width:22px;height:22px}
  .chip{font-size:15px;padding:4px 8px}
  .pb{width:14px;height:14px}
  .streak{font-size:18px}.streak svg{width:18px}
  .starcount{font-size:18px}.starcount svg{width:20px}
  .ground{flex-basis:12px}
  .screen{gap:10px;padding-block:6px}
  .title{font-size:clamp(34px,9vw,60px)}
  .scene .s-castle svg{width:200px}.scene .s-giant svg{width:80px}.scene .s-oren svg,.scene .s-cat svg{width:56px}
  .bigbtn{font-size:22px;padding:10px 24px}.bigbtn svg{width:26px;height:26px}
  .lands{gap:10px;grid-template-columns:repeat(3,minmax(100px,150px))}
  .land{min-height:130px;padding:22px 6px 8px}.land .ico{height:44px}.land .ico svg{height:40px}.land .nm{font-size:15px}.land .op{width:26px;height:26px;font-size:17px;top:16px}
  .castlepanel .cs svg{width:240px}
  .landhead h1{font-size:28px}.landhead .ico svg{height:40px}
  .node{width:96px;padding:10px 4px 8px}.node .lbl{font-size:22px}.node .st svg{width:18px}.node.boss{width:120px}.node.boss .gi svg{width:44px}
  .play{grid-template-columns:1fr;gap:12px;justify-items:center}
  .talk{min-height:0}.cat svg{width:44px}
  .bubble{font-size:18px;padding:6px 12px;min-height:0}
  .giant svg{width:70px}.hp i{width:12px;height:16px}
  .eqcard{font-size:44px;padding:10px 18px;gap:10px}
  .pad{grid-template-columns:repeat(6,1fr);width:min(460px,100%);gap:6px}
  .key{height:54px;font-size:28px}
  .hintbox .cap{font-size:18px}
  .steps{font-size:22px}
  .frame{grid-template-columns:repeat(5,22px)}.frame i{width:22px;height:22px}.frame i.x::after{top:9px}
  .skip b{min-width:36px;height:34px;font-size:17px}
  .learn h1{font-size:28px}
  .facts{font-size:18px}
  .lpanel{min-height:0}
  .bigeq{font-size:40px}
  .lcap{font-size:18px}
  .card{padding:16px 18px}.card h2{font-size:28px}.card .stars span svg{width:54px}.card .cs svg{width:220px}
  .final{padding:16px 20px 12px}.final .rl{font-size:20px}.final .cs svg{width:220px}
}
@media (max-width:440px){
  .lands{grid-template-columns:repeat(2,minmax(120px,1fr))}
  .eqcard{font-size:36px}
  .pad{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;};
const D=ms=>window.__fast?Math.ceil(ms/15):ms;

/* ---------- words for speech ---------- */
const F=['אפס','אחת','שתיים','שלוש','ארבע','חמש','שש','שבע','שמונה','תשע','עשר','אחת עשרה','שתים עשרה','שלוש עשרה','ארבע עשרה','חמש עשרה','שש עשרה','שבע עשרה','שמונה עשרה','תשע עשרה','עשרים'];
const TENS=['','','עשרים','שלושים','ארבעים','חמישים','שישים','שבעים','שמונים','תשעים'];
const nw=n=>n<=20?F[n]:n===100?'מאה':(n%10?TENS[n/10|0]+' ו'+F[n%10]:TENS[n/10]);
const OPW={'+':'ועוד','−':'פחות','×':'כפול',':':'חלקי'};

/* ---------- sprites ---------- */
function sprite(rows,pal){
  const w=rows[0].length,hh=rows.length;let r='';
  rows.forEach((row,y)=>{[...row].forEach((c,x)=>{if(pal[c])r+=`<rect x="${x}" y="${y}" width="1.04" height="1.04" fill="${pal[c]}"/>`;});});
  return `<svg class="px" viewBox="0 0 ${w} ${hh}" aria-hidden="true">${r}</svg>`;
}
const SPR={
  cat:sprite(['.OO......OO.','.OPO....OPO.','.OOODOODOOO.','OOOOOOOOOOOO','OOWBOOOOWBOO','OOWBOOOOWBOO','OOOOONNOOOOO','OLLLLLLLLLLO','OLLLLLLLLLLO','OOOOOOOOOOOO','.OD......DO.','.OD......DO.'],
    {O:'#f2a65a',D:'#d9823b',P:'#f7b6c2',W:'#ffffff',B:'#2b2b3a',N:'#e8778f',L:'#fde3c4'}),
  oren:sprite(['HHHHHHHH','HHHHHHHH','HSSSSSSH','SSSSSSSS','SWESSEWS','SSSSSSSS','SSSMMSSS','SSSSSSSS','TTTTTTTT','TTTTTTTT','YYYYYYYY','STTTTTTS','.PPPPPP.','.PPPPPP.','.PP..PP.','.FF..FF.'],
    {H:'#5b3a1e',S:'#f1c27d',W:'#ffffff',E:'#2b2b3a',M:'#c0705a',T:'#e4572e',Y:'#ffd166',P:'#2f5d8a',F:'#2b2b2b'}),
  giant:sprite(['..SSSSSSSSSS..','.SSSSSSSSSSSS.','.SSMMSSSSSMMS.','.SSSSSSSSSSSS.','.SSEESSSSEESS.','.SSEESSSSEESS.','.SSSSSNNSSSSS.','.SSKSSSSSSKSS.','..SSKKKKKKSS..','SSSSSSSSSSSSSS','SSdSSSMMSSSdSS','SSdSSSSSSSSdSS','SS.SSSSSSSS.SS','SS.SSSSSSSS.SS','...SSS..SSS...','...SSS..SSS...'],
    {S:'#8d939a',d:'#6b7178',M:'#6aa84f',E:'#b8ff6a',N:'#747a81',K:'#3a3f45'}),
  star:sprite(['....Y....','...YYY...','YYYYyYYYY','.YYyYYYY.','..YYYYY..','.YYYYYYY.','.YY...YY.','YY.....YY'],{Y:'#ffc93c',y:'#fff1a8'}),
  starOff:sprite(['....Y....','...YYY...','YYYYYYYYY','.YYYYYYY.','..YYYYY..','.YYYYYYY.','.YY...YY.','YY.....YY'],{Y:'rgba(0,0,0,.16)'}),
  flame:sprite(['...R...','..RR...','..RYR..','.RYYR.R','.RYYYRR','RRYWYYR','RYYWWYR','RYYWWYR','.RRYYR.'],{R:'#e4572e',Y:'#ffb02e',W:'#fff3b0'}),
  lock:sprite(['..KKK..','.K...K.','.K...K.','KKKKKKK','KGGGGGK','KGGKGGK','KGGKGGK','KKKKKKK'],{K:'#3a3f45',G:'#ffcf4d'}),
  gem:sprite(['.CCCCC.','CcCCCcC','CCCCCCC','.CCCCC.','..CCC..','...C...'],{C:'#3cc8bb',c:'#c8fff7'}),
  tree:sprite(['..GGGG..','.GGgGGG.','GGGGGgGG','GgGGGGGG','.GGGGgG.','..GGGG..','...TT...','...TT...','...TT...','..TTTT..'],{G:'#4f9a3a',g:'#7cc35f',T:'#7a5230'}),
  crystal:sprite(['...P....','..PpP...','..PpP.P.','.PPpPPpP','.PPpPPpP','.PPPPPPP','SSSSSSSS','SssSSssS','SSSSSSSS'],{P:'#b48cf2',p:'#e9dcff',S:'#6b737a',s:'#4d5359'}),
  mount:sprite(['....WW....','...WWWW...','..WWMWWM..','..MMMMMMM.','.MMMMmMMMM','.MmMMMMmMM','MMMMMMMMMM','MMMmMMMMmM'],{W:'#ffffff',M:'#7f8fa6',m:'#66758a'}),
  wave:sprite(['..WW......','.WBBW..WW.','WBBBBWWBBW','BBBBBBBBBB','BbBBBbBBbB','BBBBBBBBBB'],{W:'#e6f7ff',B:'#2f8fb0',b:'#1f6f8c'}),
  tower:sprite(['....PF....','....P.....','S.S.SS.S.S','SSSSSSSSSS','SSsSSSSsSS','SSSSSSSSSS','SSSSDDSSSS','SSSSDDSSSS','SSSSDDSSSS'],{P:'#5a5f66',F:'#e4572e',S:'#a7adb4',s:'#ffd166',D:'#6b4423'})
};
const COLORS=['#e4572e','#f28c28','#e9b949','#7cc35f','#3cb371','#3cc8bb','#3a8fc4','#6c6fd1','#b065c9','#e0609a'];
const ICON={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="#23303b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="#23303b" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>',
  say:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  music:'<svg viewBox="0 0 24 24" fill="#23303b" aria-hidden="true"><path d="M9 4v11.3A3.5 3.5 0 1 0 11 18V8h7V4H9z"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="#23303b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h12v14H8l-6-7z"/><path d="M12 9l5 6M17 9l-5 6"/></svg>',
  bulb:'<svg viewBox="0 0 24 24" fill="#ffcf4d" stroke="#8a6a10" stroke-width="1.6" aria-hidden="true"><path d="M12 2a7 7 0 0 0-4 12.7V18h8v-3.3A7 7 0 0 0 12 2z"/><rect x="9" y="19" width="6" height="3" fill="#8a6a10"/></svg>',
  redo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 3h5v5H3zM9.5 3h5v5h-5zM16 3h5v5h-5zM3 9.5h5v5H3zM9.5 9.5h5v5h-5zM16 9.5h5v5h-5zM3 16h5v5H3zM9.5 16h5v5h-5zM16 16h5v5h-5z"/></svg>',
  skip:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 5v14l9-7zM13 5v14l9-7z"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V18h3v3H8v-3h3v-3.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3zm0 4H6v1a2 2 0 0 0 1 1.7V7zm10 0v2.7A2 2 0 0 0 18 8V7h-1z"/></svg>'
};

/* ---------- castle (built from stars) ---------- */
const CASTLE=(()=>{
  const m=new Map();const set=(x,y,c)=>m.set(x+','+y,c);
  const stone=(x,y)=>((x+y)%2?'#a7adb4':'#979ea5');
  for(const x0 of [0,22]){for(let y=6;y<=18;y++)for(let x=x0;x<x0+6;x++)set(x,y,stone(x,y));for(const dx of [0,2,3,5])set(x0+dx,5,'#8a9097');}
  for(let y=11;y<=18;y++)for(let x=6;x<=21;x++)set(x,y,stone(x,y));
  for(let x=7;x<=21;x+=2)set(x,10,'#8a9097');
  for(let y=4;y<=10;y++)for(let x=10;x<=17;x++)set(x,y,stone(x,y));
  for(const x of [10,12,15,17])set(x,3,'#8a9097');
  for(let y=15;y<=18;y++)for(let x=12;x<=15;x++)set(x,y,'#6b4423');
  set(13,14,'#6b4423');set(14,14,'#6b4423');
  for(const [x,y] of [[2,9],[3,9],[2,10],[3,10],[24,9],[25,9],[24,10],[25,10],[13,6],[14,6],[13,7],[14,7],[2,14],[3,14],[24,14],[25,14],[8,13],[19,13]])set(x,y,'#ffd166');
  for(let y=1;y<=4;y++){set(1,y,'#5a5f66');set(26,y,'#5a5f66');}
  set(2,1,'#e4572e');set(3,1,'#e4572e');set(2,2,'#e4572e');
  set(25,1,'#3a8fc4');set(24,1,'#3a8fc4');set(25,2,'#3a8fc4');
  for(let y=0;y<=2;y++)set(14,y,'#5a5f66');
  set(15,0,'#ffcf4d');set(16,0,'#ffcf4d');set(15,1,'#ffcf4d');
  return [...m.entries()].map(([k,c])=>{const [x,y]=k.split(',').map(Number);return {x,y,c};}).sort((a,b)=>b.y-a.y||a.x-b.x);
})();
function castle(revealed,newFrom=revealed){
  const U=10;let s=`<svg class="px castle" viewBox="0 0 280 200" aria-hidden="true">`;
  for(let x=0;x<28;x++)s+=`<rect x="${x*U}" y="190" width="10" height="10" fill="#6aa84f"/><rect x="${x*U}" y="190" width="10" height="3" fill="#8acb68"/>`;
  CASTLE.forEach((b,i)=>{
    const cls=i<revealed?(i>=newFrom?'nw':''):'gh';
    const st=cls==='nw'?` style="animation-delay:${((i-newFrom)*0.018).toFixed(3)}s"`:'';
    s+=`<g class="${cls}"${st}><rect x="${b.x*U}" y="${b.y*U}" width="10" height="10" fill="${b.c}"/><rect x="${b.x*U}" y="${b.y*U}" width="10" height="2" fill="rgba(255,255,255,.22)"/><rect x="${b.x*U}" y="${b.y*U+8}" width="10" height="2" fill="rgba(0,0,0,.16)"/></g>`;
  });
  return s+'</svg>';
}

/* ---------- question generators ---------- */
const Q=(l,op,r,miss='res')=>{const res=op==='+'?l+r:op==='−'?l-r:op==='×'?l*r:l/r;return {l,op,r,res,miss,ans:miss==='res'?res:miss==='r'?r:l};};
function uniq(gen,n){const out=[],seen=new Set();let t=0;while(out.length<n&&t++<500){const q=gen(out.length);const k=q.l+q.op+q.r+q.miss;if(seen.has(k))continue;seen.add(k);out.push(q);}return out;}
const G={
  addSmall:()=>{const a=rand(3,9),b=rand(11-a,9);return Q(a,'+',b,Math.random()<.25?'r':'res');},
  addTens:()=>{const a=10*rand(1,8),b=10*rand(1,9-a/10);return Q(a,'+',b,Math.random()<.25?'r':'res');},
  add21:()=>{let a;do{a=rand(11,88);}while(a%10>8);return Q(a,'+',rand(1,9-a%10));},
  add22:()=>{const at=rand(1,7),a1=rand(0,8),bt=rand(1,8-at),b1=rand(0,9-a1);return Q(at*10+a1,'+',bt*10+b1,Math.random()<.15?'r':'res');},
  addCarry:()=>{const a1=rand(2,9),b1=rand(10-a1,9),at=rand(1,7),bt=rand(0,8-at);return Q(at*10+a1,'+',bt*10+b1);},
  subSmall:()=>{const a=rand(11,18),b=rand(Math.max(a%10+1,a-9),9);return Q(a,'−',b,Math.random()<.25?'r':'res');},
  subTens:()=>{const a=10*rand(2,10),b=10*rand(1,a/10-1);return Q(a,'−',b,Math.random()<.2?'r':'res');},
  sub21:()=>{let a;do{a=rand(12,99);}while(a%10===0);return Q(a,'−',rand(1,a%10));},
  sub22:()=>{const at=rand(2,9),a1=rand(0,9),bt=rand(1,at-1),b1=rand(0,a1);return Q(at*10+a1,'−',bt*10+b1);},
  subBorrow:()=>{const at=rand(2,9),a1=rand(0,8),b1=rand(a1+1,9),bt=rand(0,at-2);return Q(at*10+a1,'−',bt*10+b1);}
};
function mulGen(tables){
  return ()=>{const k=pick(tables),n=rand(1,10);const flip=Math.random()<.4;const l=flip?n:k,r=flip?k:n;
    const rm=Math.random();const miss=rm<.18?(flip?'l':'r'):'res';const q=Q(l,'×',r,miss);q.fact=[k,n];return q;};
}
function divGen(tables){return ()=>{const k=pick(tables),n=rand(1,10);const q=Q(k*n,':',k);q.fact=[k,n];return q;};}
const mixGen=gens=>()=>pick(gens)();
const ALLT=[2,3,4,5,6,7,8,9,10];

/* ---------- lands & levels ---------- */

/* ---------- audio ---------- */
let ac=null,master=null,musicBus=null,musicTimer=null;
function audio(){
  if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    ac=new C();master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);musicBus=ac.createGain();musicBus.gain.value=.8;musicBus.connect(master);}
  if(ac.state==='suspended')ac.resume();return ac;
}
function tone(f,t0,dur,type='sine',vol=.12,bus){
  const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(bus||master);o.start(t0);o.stop(t0+dur+.05);
}
const now=()=>{const a=audio();return a?a.currentTime:0;};
const sfx={
  key(){tone(700,now(),.05,'square',.03);},
  pop(i=1){tone(420+i*25,now(),.12,'square',.04);},
  ok(streak=0){const t=now(),b=1+Math.min(streak,8)*.06;tone(660*b,t,.22,'triangle',.13);tone(990*b,t+.1,.35,'triangle',.13);},
  no(){const t=now();tone(240,t,.22,'sine',.12);tone(190,t+.13,.3,'sine',.1);},
  hit(){const t=now();tone(140,t,.25,'square',.08);tone(90,t+.05,.3,'sawtooth',.05);},
  win(){const t=now();[523,659,784,1046,1318].forEach((f,i)=>tone(f,t+i*.11,.6,'triangle',.12));},
  star(i){tone(880+i*220,now(),.4,'triangle',.12);},
  build(){const t=now();for(let i=0;i<8;i++)tone(300+i*40,t+i*.06,.08,'square',.03);}
};
const NOTES=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];const BASS=[130.81,98,110,87.31];let beat=0;
function musicStart(){if(musicTimer||!save.music||!audio())return;musicTimer=setInterval(()=>{const t=now();if(beat%4===0)tone(BASS[(beat/4)%4|0],t,3.6,'sine',.045,musicBus);if(Math.random()<.6)tone(NOTES[rand(0,7)],t,2.2,'triangle',.025,musicBus);beat++;},1000);}
function musicStop(){clearInterval(musicTimer);musicTimer=null;}
function duck(on){if(musicBus&&ac)musicBus.gain.setTargetAtTime(on?.3:.8,ac.currentTime,.2);}

let heVoice=null,sayNow='';
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices().filter(v=>/^(he|iw)/i.test(v.lang));
  heVoice=vs.find(v=>/Hila/i.test(v.name))||vs.find(v=>/Avri/i.test(v.name))||vs.find(v=>/Natural|Online/i.test(v.name))||vs[0]||null;$('#voiceNote').hidden=!!heVoice;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;setTimeout(pickVoice,1500);}else $('#voiceNote').hidden=false;
function say(t){if(!('speechSynthesis' in window)||!t||window.__fast)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';if(heVoice)u.voice=heVoice;u.rate=.92;u.pitch=1.05;u.onstart=()=>duck(true);u.onend=u.onerror=()=>duck(false);speechSynthesis.speak(u);}

/* ---------- confetti ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function fit(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;}addEventListener('resize',fit);fit();
const PC=['#ffcf4d','#4fbf63','#3cc8bb','#ff7eb6','#e4572e','#8ccbea','#ffffff'];
function burst(x,y,n=24,sp=1,cols=PC){if(matchMedia('(prefers-reduced-motion: reduce)').matches||window.__fast)return;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(2+Math.random()*6)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,sz:6+Math.random()*8,c:cols[i%cols.length],life:70+Math.random()*40,r:Math.random()*6});}
  if(!raf)raf=requestAnimationFrame(tick);}
function rain(){const w=cv.clientWidth;for(let i=0;i<5;i++)setTimeout(()=>burst(Math.random()*w,cv.clientHeight*.35,36,1.4),i*220);}
function tick(){const d=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.life--;p.r+=.1;cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;cx.fillRect(-p.sz*d/2,-p.sz*d/2,p.sz*d,p.sz*d);cx.restore();});
  raf=parts.length?requestAnimationFrame(tick):0;}
const center=el=>{const r=el.getBoundingClientRect(),c=cv.getBoundingClientRect();return [r.left+r.width/2-c.left,r.top+r.height/2-c.top];};

/* ---------- hint visuals ---------- */
function frames(cells){let s='<div class="tf">';for(let f=0;f<2;f++){if(f===1&&cells.length<=10)break;s+='<div class="frame">';for(let i=0;i<10;i++)s+=`<i class="${cells[f*10+i]||''}"></i>`;s+='</div>';}return s+'</div>';}
function baseTen(n,c){const t=n/10|0,o=n%10;let s=`<div class="btwrap"><div class="btn10" style="--c:${c}">`;for(let i=0;i<t;i++)s+='<div class="rod">'+'<i></i>'.repeat(10)+'</div>';if(o)s+='<div class="ones">'+'<i class="one"></i>'.repeat(o)+'</div>';return s+`</div><div class="btlbl">${n}</div></div>`;}
function arr(rows,cols,sz=18){let s=`<div class="arr" style="--s:${sz}px">`;for(let r=0;r<rows;r++)s+=`<div class="r"><small>${r+1}</small>${`<i style="--c:${COLORS[r%10]}"></i>`.repeat(cols)}</div>`;return s+'</div>';}
function skipS(k,count,hideLast){let s='<div class="skip">';for(let i=1;i<=count;i++)s+=(hideLast&&i===count)?`<b class="q">?<small>${i}</small></b>`:`<b>${k*i}<small>${i}</small></b>`;return s+'</div>';}
function share(k,n){let s='<div class="share">';for(let i=0;i<k;i++)s+=`<div class="box">${SPR.gem.repeat(n)}</div>`;return s+'</div>';}
const steps=lines=>`<div class="steps">${lines.map(l=>`<div>${l}</div>`).join('')}</div>`;
const cap=t=>`<div class="cap">${t}</div>`;
const L=t=>`<span class="ltr">${t}</span>`;
const tens=n=>n-n%10;
function hintFor(q,level){
  const {l,r,res,op,miss}=q;
  if(op==='+'){
    if(miss!=='res'){
      if(res<=20)return level===1?cap('כַּמָּה רִבּוּעִים רֵיקִים?')+frames([...Array(l).fill('a'),...Array(res-l).fill('e')]):steps([`${res} − ${l} = <b>?</b>`]);
      return level===1?cap(`מִ-${L(l)} עַד ${L(res)}: כַּמָּה חָסֵר?`)+`<div class="bt">${baseTen(l,'#e8873a')}${baseTen(res,'#3a8fc4')}</div>`:steps([`${res} − ${l} = <b>?</b>`]);
    }
    if(res<=20&&l<10){
      const need=10-l;
      return level===1?cap('מַשְׁלִימִים לְ-10')+frames([...Array(l).fill('a'),...Array(r).fill('b')]):steps([`${l} + ${need} = 10`,`10 + ${r-need} = <b>?</b>`]);
    }
    if(level===1)return cap('קוֹדֶם עֲשָׂרוֹת, אַחַר כָּךְ אֲחָדוֹת')+`<div class="bt">${baseTen(l,'#e8873a')}${baseTen(r,'#3a8fc4')}</div>`;
    const T=tens(l)+tens(r),O=l%10+r%10;
    return steps(T&&O?[`${tens(l)} + ${tens(r)} = ${T}`,`${l%10} + ${r%10} = ${O}`,`${T} + ${O} = <b>?</b>`]:[`${tens(l)} + ${tens(r)} = <b>?</b>`]);
  }
  if(op==='−'){
    if(miss!=='res'){
      if(l<=20)return level===1?cap(`כַּמָּה צָרִיךְ לִמְחֹק כְּדֵי שֶׁיִּשָּׁאֲרוּ ${L(res)}?`)+frames([...Array(res).fill('b'),...Array(l-res).fill('a')]):steps([`${l} − ${res} = <b>?</b>`]);
      return steps([`${l} − ${res} = <b>?</b>`]);
    }
    if(l<=20){
      const toTen=l-10;
      return level===1?cap('מוֹחֲקִים וְסוֹפְרִים מַה נִּשְׁאַר')+frames([...Array(l-r).fill('a'),...Array(r).fill('x')]):steps(r>toTen?[`${l} − ${toTen} = 10`,`10 − ${r-toTen} = <b>?</b>`]:[`${l} − ${r} = <b>?</b>`]);
    }
    if(level===1)return cap(`מוֹרִידִים מִ-${L(l)} קוֹדֶם ${L(tens(r)||r)}`)+`<div class="bt">${baseTen(l,'#e8873a')}</div>`;
    if(tens(r)&&r%10)return steps([`${l} − ${tens(r)} = ${l-tens(r)}`,`${l-tens(r)} − ${r%10} = <b>?</b>`]);
    if(!tens(r)&&r<=l%10)return steps([`${l%10} − ${r} = ${l%10-r}`,`${tens(l)} + ${l%10-r} = <b>?</b>`]);
    if(!tens(r)&&r>l%10)return steps([`${l} − ${l%10} = ${tens(l)}`,`${tens(l)} − ${r-l%10} = <b>?</b>`]);
    return steps([`${tens(l)} − ${tens(r)} = ${tens(l)-tens(r)}`,`${tens(l)-tens(r)} + ${l%10} = <b>?</b>`]);
  }
  if(op==='×'){
    if(miss==='res'){
      return level===1?cap(`${L(l)} קְבוּצוֹת שֶׁל ${L(r)}`)+arr(l,r,r>=8||l>=8?14:18):cap(`קְפִיצוֹת שֶׁל ${L(r)}`)+skipS(r,l,true);
    }
    const k=miss==='r'?l:r;
    return level===1?cap(`קְפִיצוֹת שֶׁל ${L(k)} עַד ${L(res)}. כַּמָּה קְפִיצוֹת?`)+skipS(k,res/k,false):cap(`${L(res)} בְּשׁוּרוֹת שֶׁל ${L(k)}. כַּמָּה שׁוּרוֹת?`)+arr(res/k,k,k>=8?14:18);
  }
  // division
  const p=l,k=r,n=res;
  return level===1?cap(`${L(k+' × ? = '+p)}<br>קְפִיצוֹת שֶׁל ${L(k)} עַד ${L(p)}. כַּמָּה קְפִיצוֹת?`)+skipS(k,n,false):cap(`מְחַלְּקִים ${L(p)} לְ-${L(k)} תֵּבוֹת. כַּמָּה בְּכָל תֵּבָה?`)+share(k,n);
}

/* ---------- PLAY ---------- */
let play=null;
function startLevel(lv){
  hush();
  if(lv.table&&!lv.boss)return learnMul(lv);
  if(lv.div)return learnDiv(lv);
  playLevel(lv);
}
const PRAISE=['כָּל הַכָּבוֹד!','מְצֻיָּן!','נָכוֹן!','יוֹפִי!','אַלּוּף!','בְּדִיּוּק!','וָאוּ!'];
function playLevel(lv){
  hush();
  setScreen('sPlay',lv.land.sky,()=>showLand(lv.land));
  const qs=uniq(lv.gen,lv.n);
  play={lv,qs,i:0,errors:0,hints:0,streak:0,best:0,tries:0,hint:0,input:'',lock:false,requeued:new Set(),hp:qs.length};
  const s=$('#sPlay');s.innerHTML='';
  const wrap=h('div','play');
  const left=h('div','left');
  const top=lv.boss?h('div','bossrow',`<div class="giant" id="giant">${SPR.giant}</div><div class="hp" id="hp">${'<i></i>'.repeat(play.hp)}</div>`)
                   :h('div','talk',`<div class="cat" id="cat">${SPR.cat}</div><button class="bubble" id="bubble"><span id="bIco">${ICON.say}</span><span id="bText"></span></button>`);
  const eq=h('div','eqcard');eq.id='eq';
  const hintRow=h('div','btnrow');
  const hb=h('button','hintbtn',ICON.bulb+'<span>רֶמֶז</span>');hb.id='hintBtn';hb.onclick=()=>showHint(true);
  hintRow.appendChild(hb);
  const hintbox=h('div','hintbox');hintbox.id='hint';hintbox.hidden=true;
  left.append(top,eq,hintRow,hintbox);
  const pad=h('div','pad');
  ['1','2','3','4','5','6','7','8','9','del','0','go'].forEach(k=>{
    const b=h('button','key'+(k==='go'?' go':''),k==='del'?ICON.del:k==='go'?ICON.check:k);
    b.dataset.k=k;b.setAttribute('aria-label',k==='del'?'מחק':k==='go'?'בדוק':k);
    b.onclick=()=>press(k);pad.appendChild(b);
  });
  wrap.append(left,pad);s.appendChild(wrap);
  const bub=$('#bubble');if(bub)bub.onclick=()=>say(sayNow);
  if(lv.boss){sayNow=lv.final?'טירת האלופים! הענק הגדול מכולם. כל תשובה נכונה מורידה לו בלוק.':'ענק הבלוקים! כל תשובה נכונה מורידה לו בלוק.';say(sayNow);}
  else say(lv.say);
  showQ();
}
function hudPlay(){
  const p=play;
  $('#hudMid').innerHTML=`<div class="chip">${p.lv.boss?(p.lv.final?'הָעֲנָק הַגָּדוֹל':'עֲנַק הַבְּלוֹקִים'):p.lv.land.name}</div><div class="progress">${p.qs.map((_,k)=>`<i class="pb${k<p.i?' on':k===p.i?' cur':''}"></i>`).join('')}</div>${p.streak>=2?`<div class="streak hot">${SPR.flame}${p.streak}</div>`:''}`;
}
function setBubble(t){const b=$('#bText');if(b)b.textContent=t;}
function qSpeech(q){const parts=[q.miss==='l'?'כמה':nw(q.l),OPW[q.op],q.miss==='r'?'כמה':nw(q.r),'שווה',q.miss==='res'?'כמה':nw(q.res)];return parts.join(' ')+'?';}
function showQ(){
  const p=play;const q=p.qs[p.i];
  p.tries=0;p.hint=0;p.input='';p.lock=false;
  const eq=$('#eq');
  const cell=(v,key)=>q.miss===key?`<span class="ans empty" id="ans">?</span>`:`<span>${v}</span>`;
  eq.innerHTML=`${cell(q.l,'l')}<span class="op">${q.op}</span>${cell(q.r,'r')}<span class="op">=</span>${cell(q.res,'res')}`;
  eq.style.animation='none';void eq.offsetWidth;eq.style.animation='fadein .35s';
  $('#hint').hidden=true;$('#hint').innerHTML='';
  $('#hintBtn').hidden=false;
  setBubble(q.miss==='res'?'כַּמָּה זֶה?':'מַה חָסֵר?');
  sayNow=qSpeech(q);
  hudPlay();
}
function renderInput(){const a=$('#ans');if(!a)return;a.className='ans'+(play.input?'':' empty');a.textContent=play.input||'?';}
function press(k){
  const p=play;if(!p||p.lock)return;
  const kb=document.querySelector(`.key[data-k="${k}"]`);if(kb){kb.classList.add('press');setTimeout(()=>kb.classList.remove('press'),120);}
  if(k==='del'){p.input=p.input.slice(0,-1);sfx.key();renderInput();return;}
  if(k==='go'){if(p.input)submit();return;}
  if(p.input.length>=3)return;
  if(p.input==='0')p.input='';
  p.input+=k;sfx.key();renderInput();
}
addEventListener('keydown',e=>{
  if(!play||$('#sPlay').hidden||!$('#ov').hidden)return;
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==='Backspace'){e.preventDefault();press('del');}
  else if(e.key==='Enter'){e.preventDefault();press('go');}
});
function showHint(manual){
  const p=play;if(!p||p.lock)return;
  if(p.hint>=2)return;
  p.hint++;if(manual)p.hints++;
  const q=p.qs[p.i];
  const hb=$('#hint');hb.hidden=false;hb.innerHTML=hintFor(q,p.hint);
  hb.style.animation='none';void hb.offsetWidth;hb.style.animation='fadein .35s';
  if(p.hint>=2)$('#hintBtn').hidden=true;
  setBubble('הִנֵּה רֶמֶז');
}
function praise(text){const eq=$('#eq');const pr=h('div','praise',text);eq.appendChild(pr);setTimeout(()=>pr.remove(),1000);}
function submit(){
  const p=play,q=p.qs[p.i];const v=parseInt(p.input,10);const a=$('#ans');
  if(v===q.ans){
    p.lock=true;p.streak++;p.best=Math.max(p.best,p.streak);
    a.className='ans ok';sfx.ok(p.streak);burst(...center(a),22);
    praise(p.streak>=5&&p.streak%5===0?`🔥 ${p.streak}!`:pick(PRAISE));
    if(q.fact&&p.tries===0&&p.hint===0)markFact(q.fact[0],q.fact[1],q.op===':'?2:1);
    const c=$('#cat');if(c){c.classList.remove('hop','tilt');void c.offsetWidth;c.classList.add('hop');}
    if(p.lv.boss){p.hp--;const g=$('#giant');g.classList.remove('hit','laugh');void g.offsetWidth;g.classList.add('hit');sfx.hit();
      const hp=$('#hp').children;for(let k=0;k<hp.length;k++)hp[k].classList.toggle('gone',k>=p.hp);burst(...center(g),16,1,['#8d939a','#6b7178','#6aa84f']);}
    p.i++;hudPlay();
    setTimeout(()=>{if(play!==p)return;if(p.i>=p.qs.length)finishLevel();else showQ();},D(1100));
    return;
  }
  p.tries++;p.errors++;p.streak=0;hudPlay();sfx.no();
  a.className='ans bad';
  const eq=$('#eq');eq.classList.remove('shake');void eq.offsetWidth;eq.classList.add('shake');
  const c=$('#cat');if(c){c.classList.remove('hop','tilt');void c.offsetWidth;c.classList.add('tilt');}
  const g=$('#giant');if(g){g.classList.remove('hit','laugh');void g.offsetWidth;g.classList.add('laugh');}
  if(p.tries>=3){
    p.lock=true;
    setTimeout(()=>{if(play!==p)return;a.className='ans show';a.textContent=q.ans;setBubble('הַתְּשׁוּבָה הִיא '+q.ans+'. נְנַסֶּה שׁוּב בַּסּוֹף.');
      if(!p.requeued.has(p.i)){const copy=Object.assign({},q);p.qs.push(copy);p.requeued.add(p.qs.length-1);
        if(p.lv.boss){p.hp++;$('#hp').insertAdjacentHTML('beforeend','<i></i>');}}
      say('התשובה היא '+nw(q.ans));
      setTimeout(()=>{if(play!==p)return;p.i++;if(p.i>=p.qs.length)finishLevel();else showQ();},D(2600));
    },D(500));
    return;
  }
  setTimeout(()=>{if(play!==p)return;p.input='';renderInput();},D(600));
  setBubble('כִּמְעַט! נַסֵּה שׁוּב');
  if(p.hint<p.tries)showHint(false);
}
function finishLevel(){
  const p=play;p.lock=true;const lv=p.lv;
  const miss=p.errors+p.hints;
  const st=miss<=1?3:miss<=4?2:1;
  const before=pts();const prev=stars(lv.id);
  if(st>prev){save.s[lv.id]=st;persist();}
  const after=pts();
  const r0=revealedFor(before),r1=revealedFor(after);
  if(lv.boss){const g=$('#giant');if(g)g.classList.add('down');}
  setTimeout(()=>{
    const ov=$('#ov');ov.hidden=false;
    const title=lv.final?'נִצַּחְתָּ אֶת הָעֲנָק הַגָּדוֹל!':lv.boss?'נִצַּחְתָּ אֶת הָעֲנָק!':'כָּל הַכָּבוֹד אוֹרֶן!';
    ov.innerHTML=`<div class="card"><h2>${title}</h2><div class="stars">${[0,1,2].map(k=>`<span style="animation-delay:${.3+k*.35}s">${k<st?SPR.star:SPR.starOff}</span>`).join('')}</div><div class="cs">${castle(r1,r0)}</div></div>`;
    const card=ov.firstChild;
    const row=h('div','btnrow');
    const again=h('button','bigbtn plain sm',ICON.redo+'<span>שׁוּב</span>');again.onclick=()=>startLevel(lv);
    row.appendChild(again);
    const nextLv=lv.land.levels[lv.i+1];
    if(lv.final){const f=h('button','bigbtn sm',ICON.trophy+'<span>הַתְּעוּדָה</span>');f.onclick=showFinal;row.appendChild(f);}
    else if(nextLv){const n=h('button','bigbtn',ICON.play+'<span>הַבָּא</span>');n.onclick=()=>startLevel(nextLv);row.appendChild(n);}
    else{const n=h('button','bigbtn',ICON.home+'<span>לַמַּפָּה</span>');n.querySelector('svg').style.filter='invert(1)';n.onclick=showMap;row.appendChild(n);}
    card.appendChild(row);
    sfx.win();rain();
    for(let k=0;k<st;k++)setTimeout(()=>sfx.star(k),D(300+k*350));
    if(r1>r0)setTimeout(()=>sfx.build(),D(1300));
    sayNow=lv.final?'וואו! ניצחת את הענק הגדול! אתה אלוף החשבון!':lv.boss?'ניצחת את הענק! כל הכבוד!':st===3?'שלושה כוכבים! מושלם!':'כל הכבוד אורן!';
    say(sayNow);
    setTimeout(()=>{const b=row.lastChild;b&&b.focus();},300);
  },D(lv.boss?900:300));
}

/* TABLE */
function showTable(){
  setScreen('sTable','mount',showMap);
  const c=masteredCount();
  $('#hudMid').innerHTML=`<div class="chip">לוּחַ הַכֶּפֶל שֶׁלִּי</div><div class="starcount"><span>${c} / 100</span></div>`;
  sayNow='כל משבצת נדלקת כשאתה עונה עליה נכון בלי רמז.';
  const s=$('#sTable');s.innerHTML='';
  const g=h('div','tgrid');
  g.appendChild(h('div','hd','×'));
  for(let b=1;b<=10;b++)g.appendChild(h('div','hd',String(b)));
  for(let a=1;a<=10;a++){
    g.appendChild(h('div','hd',String(a)));
    for(let b=1;b<=10;b++){
      const v=save.m[a+'x'+b]||0;
      const cell=h('button','tcell'+(v&1?' m':''),String(a*b)+(v&2?'<i class="dv"></i>':''));
      cell.style.setProperty('--c',COLORS[a-1]);
      cell.setAttribute('aria-label',`${a} × ${b}`);
      cell.onclick=()=>{sfx.pop(a);say(F[a]+' כפול '+F[b]+' שווה '+nw(a*b));};
      g.appendChild(cell);
    }
  }
  s.append(g,h('div','tlegend',`<span><i></i>כֶּפֶל בְּלִי רֶמֶז</span><span><i class="d"></i>חִלּוּק בְּלִי רֶמֶז</span>`));
}

/* FINAL */
function showFinal(){
  setScreen('sFinal','final',showMap);
  $('#hudMid').innerHTML=`<div class="starcount">${SPR.star}<span>${totalStars()} / ${ALL_LEVELS.length*3}</span></div>`;
  const date=new Date().toLocaleDateString('he-IL');
  $('#sFinal').innerHTML=`<div class="final">
    <div class="t1">תְּעוּדָה</div>
    <div class="nm">אוֹרֶן גֶּרְמָן</div>
    <div class="rl">אַלּוּף הַחֶשְׁבּוֹן</div>
    <div class="cs">${castle(revealedFor(pts()))}</div>
    <div class="facts2"><span>${SPR.star}${totalStars()}</span><span>${ICON.grid.replace('currentColor','#3a8fc4')}${masteredCount()} / 100</span></div>
    <div style="font-size:15px;color:#4a5a66">+ − × : · ${date}</div>
  </div><div class="note">לשמירה: צלמו את המסך</div>`;
  sfx.win();rain();
  sayNow='אורן גרמן, אלוף החשבון! כל הכבוד!';say(sayNow);
}

window.__oren2={hintFor,uniq,get play(){return play;},LANDS,save,startLevel,playLevel,showMap,showTable,showFinal,setFast:v=>{window.__fast=v;}};
})();
</script>
